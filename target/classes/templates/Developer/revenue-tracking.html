<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thống kê Doanh thu - Developer</title>
  <style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#0f172a;color:#fff}header{background:#111827;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}.logo{color:#22d3ee;font-weight:bold}.container{padding:28px}.card{background:#111827;padding:18px;border-radius:10px;border:1px solid #374151;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:16px;border-radius:8px;background:#0f172a;border:1px solid #374151}.chart{height:300px;background:linear-gradient(180deg,#0f172a,#0b1220);border-radius:8px;border:1px solid #374151}</style>
</head>
<body>
<header><div class="logo">GameStore Developer</div></header>
<main class="container">
  <h1 style="margin-bottom:12px">Theo dõi Thống kê Doanh thu</h1>
  <div class="card">
    <div class="grid">
      <div class="metric">Doanh thu tổng<br><strong style="color:#22d3ee;font-size:20px">8.765.000đ</strong></div>
      <div class="metric">Doanh thu tháng này<br><strong style="color:#22d3ee;font-size:20px">1.234.000đ</strong></div>
      <div class="metric">Lượt mua<br><strong style="color:#22d3ee;font-size:20px">1.024</strong></div>
    </div>
    <div class="chart">[Biểu đồ doanh thu theo ngày/tháng - placeholder]</div>
  </div>

  <div class="card">
    <h3>Chi tiết theo game</h3>
    <table style="width:100%;border-collapse:collapse;color:#d1d5db">
      <thead><tr style="color:#9ca3af"><th>Game</th><th>Doanh thu</th><th>Đơn hàng</th></tr></thead>
      <tbody>
        <tr><td>Cyber Warriors</td><td>3.200.000đ</td><td>320</td></tr>
        <tr><td>Legends Arena</td><td>2.100.000đ</td><td>210</td></tr>
      </tbody>
    </table>
  </div>
</main>
<footer style="background:#111827;padding:18px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
