<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý Game - Developer</title>
  <style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#0f172a;color:#fff}header{background:#111827;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}.logo{color:#22d3ee;font-weight:bold}.container{padding:28px}.card{background:#111827;padding:18px;border-radius:10px;border:1px solid #374151;margin-bottom:16px}input,select,textarea{width:100%;padding:10px;border-radius:6px;background:#0f172a;border:1px solid #374151;color:#fff;margin-bottom:8px}button{padding:10px 14px;border-radius:8px;border:none;cursor:pointer}.btn-primary{background:#22d3ee;color:#000}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #374151;text-align:left;color:#d1d5db}</style>
</head>
<body>
<header><div class="logo">GameStore Developer</div></header>
<main class="container">
  <h1 style="margin-bottom:12px">Quản lý Game</h1>

  <div class="card">
    <h3 style="margin-bottom:8px">Tạo / Cập nhật Game</h3>
    <form id="devGameForm" action="/developer/create-game" method="post" enctype="multipart/form-data">
		<input id="gamename" name="GameId" placeholder="GameId" th:value="${gameEdit?.game_id}" hidden />
      <input id="gamename" name="gamename" placeholder="Tên game" th:value="${gameEdit?.game_name}" />
      <textarea id="description" name="description" placeholder="Mô tả"  th:text="${gameEdit?.description}"></textarea>
      <input id="price" type="number" name="price" placeholder="Giá"  th:value="${gameEdit?.price}" />

      <h4 style="margin-top:8px;margin-bottom:6px">Cấu hình</h4>
      <select id="ram" name="ram">
		<option value="">RAM</option>
	    <option value="4GB" th:selected="${gameEdit?.ram == '4GB'}">4GB</option>
	    <option value="8GB" th:selected="${gameEdit?.ram == '8GB'}">8GB</option>
	    <option value="12GB" th:selected="${gameEdit?.ram == '12GB'}">12GB</option>
	    <option value="16GB" th:selected="${gameEdit?.ram == '16GB'}">16GB</option>
	    <option value="24GB" th:selected="${gameEdit?.ram == '24GB'}">24GB</option>
	    <option value="32GB" th:selected="${gameEdit?.ram == '32GB'}">32GB</option>
	    <option value="48GB" th:selected="${gameEdit?.ram == '48GB'}">48GB</option>
	    <option value="64GB" th:selected="${gameEdit?.ram == '64GB'}">64GB</option>
      </select>
      <input name = "storage" placeholder = "Bộ nhớ"  th:value="${gameEdit?.storage}"/>
	  <input type="hidden"
	         name="oldThumbnail"
	         th:value="${gameEdit.thumbnail}">
	  <label>Thumbnail hiện tại</label>
	  <div th:if="${gameEdit.thumbnail != null}">
	      <img th:src="@{/uploads/images/{file}(file=${gameEdit.thumbnail})}"
	           width="150">
	  </div>

	  <input type="file" name="thumbnail" accept="image/*">
	  
	  <label>Video hiện tại</label>
	
	<div th:if="${gameEdit.video_url != null and gameEdit.video_url.startsWith('http')}">
		      <a th:href="${gameEdit.video_url}" target="_blank">
	          Xem video
	      </a>
	  </div>

	  <div th:unless="${gameEdit.video_url != null and gameEdit.video_url.startsWith('http')}">
	      <video width="400" controls>
	          <source th:src="@{'/videos/' + ${gameEdit.video_url}}">
	      </video>
	  </div>
	  
	  <input type="file" name="video" accept="video/*">

	  <p>Hoặc nhập đường dẫn</p>

	  <input type="text"
	         name="url"
	         th:value="${gameEdit.video_url}">
		
	<p>Thêm hình ảnh</p>		 
	  <div th:if="${gameImages != null}">
	      <img th:each="img : ${gameImages}"
	           th:src="@{/uploads/images/{file}(file=${img.image_url})}"
	           width="120"
	           style="margin:5px">
	  </div>

	  <input type="file"
	         name="images"
	         accept="image/*"
	         multiple>

      <label style="color:#9ca3af;font-size:13px;margin-top:6px;display:block">Thể loại</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <label style="font-size:13px;color:#d1d5db" th:each = "item :${listcate}">
			<input type="checkbox" th:text = "${item.category_name}" name = "categories" th:value = "${item.category_id}" th:checked="${selectedCategories != null and selectedCategories.contains(item.category_id)}">
		</label>
      </div>
	  
			<div style="display:flex;gap:8px;margin-top:8px">
				<button class="btn-primary" id="saveBtn" type="submit" th:text="${gameEdit?.game_id != null} ? 'Lưu' : 'Thêm'">Lưu</button>
				<button type="button" id="cancelBtn" th:style="${gameEdit != null} ? '' : 'display:none'" onclick="resetForm()">Hủy</button>
				<button class="" type="reset">Xóa</button>
			</div>
    </form>
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px">Danh sách Game</h3>
    <table class="table">
      <thead>
		<tr>
			<th>Id</th>
			<th>Tên</th>
			<th>Giá</th>
			<th>Ngày ra mắt</th>
			<th>Thumbnail</th>
			<th>Trạng thái</th>
			<th>Hành động</th>
		</tr>
	</thead>
      <tbody>
        <tr th:each = "game :${listgame}">
          <td th:text = "${game.game_id}">101</td>
          <td th:text = "${game.game_name}">Cyber Warriors</td>
          <td th:text = "${game.price}">499000</td>
		  <td th:text = "${game.release_date}">499000</td>
		  <td>		  
			<img th:src="@{/uploads/images/{file}(file=${game.thumbnail})}" width="100">
			</td>
			<td th:text = "${game.status}">499000</td>
          <td>
			<a th:href="@{/developer/game-management/edit/{id}(id=${game.game_id})}">
			       <button type="button">Chỉnh sửa</button>
			   </a>            
			<button>Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<footer style="background:#111827;padding:18px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
