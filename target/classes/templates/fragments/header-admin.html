<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Bắt đầu khối Fragment Header -->
    <div th:fragment="header-admin">
        
        <style>
            /* CĂN CHỈNH KHUNG HEADER */
            .admin-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #0b1121; /* Nền tối đồng bộ */
                padding: 16px 32px;
                border-bottom: 1px solid #1f2937;
                font-family: Arial, sans-serif;
            }

            /* LOGO */
            .admin-header .logo {
                color: #22d3ee;
                font-size: 22px;
                font-weight: bold;
                text-decoration: none;
                letter-spacing: 0.5px;
            }

            /* KHU VỰC LINK ĐIỀU HƯỚNG */
            .admin-header .nav-links {
                display: flex;
                gap: 25px; /* Khoảng cách giữa các link */
            }

            .admin-header .nav-links a {
                color: #9ca3af; /* Chữ xám nhạt */
                text-decoration: none; /* Bỏ gạch chân mặc định */
                font-size: 15px;
                font-weight: 600;
                transition: color 0.3s ease;
            }

            /* Hiệu ứng di chuột vào link */
            .admin-header .nav-links a:hover {
                color: #22d3ee; /* Sáng màu xanh ngọc */
            }

            /* KHU VỰC TÀI KHOẢN (BÊN PHẢI) */
            .admin-header .user-actions {
                display: flex;
                align-items: center;
                gap: 15px;
            }

            .admin-header .role-text {
                color: #9ca3af;
                font-size: 14px;
                margin-right: 10px;
            }

            /* NÚT BẤM CHUNG */
            .admin-header .btn {
                padding: 8px 16px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: bold;
                text-decoration: none;
                transition: all 0.3s;
                cursor: pointer;
            }

            /* NÚT TRANG CÁ NHÂN */
            .admin-header .btn-profile {
                background-color: #22d3ee;
                color: #0f172a;
                border: none;
            }

            .admin-header .btn-profile:hover {
                background-color: #67e8f9;
                transform: translateY(-2px);
            }

            /* NÚT ĐĂNG XUẤT */
            .admin-header .btn-logout {
                background-color: transparent;
                color: #ef4444;
                border: 1px solid #ef4444;
            }

            .admin-header .btn-logout:hover {
                background-color: #ef4444;
                color: white;
            }
        </style>

        <!-- GIAO DIỆN HEADER CHÍNH -->
        <header class="admin-header">
            <!-- Logo bên trái -->
            <a href="/admin/home" class="logo">GameStore Admin</a>
            
            <!-- Menu ở giữa -->
            <nav class="nav-links">
                <a href="/admin/home">Trang chủ</a>
                <a href="/admin/content-management">Nội dung</a>
                <a href="/admin/user-management">Người dùng</a>
                <a href="/admin/promotions">Khuyến mãi</a>
                <a href="/admin/revenue-report">Doanh thu</a>
            </nav>

            <!-- Nút chức năng bên phải -->
            <div class="user-actions">
                <span class="role-text" th:if="${session.rolepicked != null}" th:text="'Vai trò: ' + ${session.rolepicked}">Vai trò: Admin</span>
                <a href="/admin/profile" class="btn btn-profile">Trang cá nhân</a>
                <a href="/user/logout" class="btn btn-logout">Đăng xuất</a>
            </div>
        </header>

    </div>
</body>
</html>
