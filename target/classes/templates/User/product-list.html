<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Sản phẩm - GameStore</title>

    <style>
		a{text-decoration:none;}
		
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(180deg,#020617 0%, #071028 40%, #0f172a 100%);
            color: #e6eef6;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
            -webkit-font-smoothing: antialiased;
        }

        header { background: rgba(4,6,29,0.85); padding: 18px 56px; display:flex; align-items:center; justify-content:space-between; border-bottom: 1px solid rgba(148,163,184,0.06); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(8px); }
        .logo { color:#22d3ee; font-weight:800; font-size:20px; text-decoration:none; }
        nav a { color:#bcd6e8; margin:0 12px; text-decoration:none; }
        nav a:hover { color:#fff; }
        .header-right { display:flex; gap:10px; align-items:center; }
        .search-box { padding:10px 12px; border-radius:999px; border:none; background:#0b1220; color:#dfefff; width:220px; }
        .user-menu { background:linear-gradient(90deg,#22d3ee,#38bdf8); color:#041017; border:none; padding:10px 14px; border-radius:999px; font-weight:700; cursor:pointer; }

        main { max-width:1200px; margin:28px auto; padding: 0 20px; display:grid; grid-template-columns: 260px 1fr; gap:20px; }
        .sidebar { background:rgba(2,6,23,0.6); padding:18px; border-radius:14px; border:1px solid rgba(148,163,184,0.04); }
        .sidebar h3 { color:#67e8f9; margin-bottom:12px; font-size:14px; text-transform:uppercase; letter-spacing:0.06em; }
        .filter-group { margin-bottom:14px; }
        .filter-group h4 { color:#c8dce9; margin-bottom:8px; }
        .filter-group label { display:block; color:#c6d6ea; margin-bottom:8px; cursor:pointer; }
        .filter-group input[type=range] { width:100%; }

        .products-section { display:flex; flex-direction:column; gap:18px; }
        .products-header { display:flex; justify-content:space-between; align-items:center; }
        .products-header h2 { font-size:20px; }
        .sort-options { background:#071026; border:1px solid rgba(148,163,184,0.04); color:#cfe7fb; padding:8px 12px; border-radius:10px; }

        .games { display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; }
        .game-card { background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(4,8,20,0.6)); border-radius:14px; overflow:hidden; border:1px solid rgba(148,163,184,0.04); transition: transform .18s ease, box-shadow .18s ease; }
        .game-card:hover { transform: translateY(-6px); box-shadow: 0 18px 50px rgba(2,6,23,0.6); border-color: rgba(34,211,238,0.16); }
        .game-card img { width:100%; height:180px; object-fit:cover; display:block; }
        .game-info { padding:14px; }
        .game-title { font-weight:700; font-size:15px; color:#e6f6ff; margin-bottom:6px; }
        .game-category { font-size:12px; color:#9fb6c9; margin-bottom:8px; }
        .game-rating { color:#fbbf24; font-size:13px; margin-bottom:8px; }

        .price-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .price { color:#7ee3ff; font-weight:800; font-size:16px; }

        .action-buttons { display:flex; gap:8px; margin-top:12px; }
        .cart-btn { flex:1; background:linear-gradient(90deg,#22d3ee,#38bdf8); color:#041017; border:none; padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:700; }
		.download-btn { flex:1; background:linear-gradient(90deg,#22d3ee,#38bdf8); color:green; border:none; padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:700; }
		.wishlist-btn { background:transparent; border:1px solid #d606910f; color:#8aabc0; padding:8px 10px; border-radius:10px; cursor:pointer; }

        .pagination { display:flex; justify-content:center; gap:8px; padding-top:18px; }
        .pagination a, .pagination button { background:#071026; color:#d9eefc; padding:8px 12px; border-radius:10px; border:1px solid rgba(148,163,184,0.04); text-decoration:none; }
        .pagination a.active, .pagination button.active, .pagination a:hover { background:#22d3ee; color:#041017; border-color:#22d3ee; }

        .empty-state { text-align:center; padding:36px; color:#9fb6c9; background:rgba(2,6,23,0.4); border-radius:12px; }

        @media (max-width:1100px) { .games { grid-template-columns: repeat(2,1fr); } main { grid-template-columns: 1fr; } .sidebar { order:2; } }
        @media (max-width:700px) { .games { grid-template-columns: 1fr; } .search-box { width:140px; } header { padding:12px 16px; } }
    </style>
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
</head>

<body>
<div th:replace="fragments/header-user :: header-user"></div>

    <!-- MAIN CONTENT -->
    <form action="/user/product-list/filter" method="get">
    <main>

        <!-- SIDEBAR - FILTER -->
        <aside class="sidebar">
			
            <div class="filter-group">
				<button type="submit" class="user-menu">Lọc</button><br/><br/>
                <h3>Thể loại</h3>
                <label th:each = "item :${dscate}">
					<input type="checkbox" th:text = "${item.category_name} + ' '" name = "categories" th:value = "${item.category_id}"  th:checked="${pickedcategories != null and pickedcategories.contains(item.category_id)}">
				</label>
            </div>

            <div class="filter-group">
                <h4>Giá</h4>
				<label>
				      Từ: <strong>0đ</strong> -
				      Tới: <strong id="priceValue" th:text = "${highestPrice+'đ'}"></strong>
				  </label>

				  <input type="range"
				         id="priceRange"
				         min="0"
				         th:max="${highestPrice}"
				         th:value="${pickedprice != null ? pickedprice : highestPrice}"
				         name="price">
            </div>

            <div class="filter-group">
                <h4>RAM</h4>
                <select name = "ram" style="width: 100%; padding: 8px; border-radius: 5px; background-color: #0f172a; color: white; border: 1px solid #374151;">
                    <option value="">Chọn RAM</option>
                    <option value="4gb" th:selected = "${pickedram != null and pickedram == '4gb'}">4GB</option>
                    <option value="8gb" th:selected = "${pickedram != null and pickedram == '8gb'}">8GB</option>
                    <option value="12gb" th:selected = "${pickedram != null and pickedram == '12gb'}">12GB</option>
                    <option value="16gb" th:selected = "${pickedram != null and pickedram == '16gb'}">16GB</option>
                    <option value="24gb" th:selected = "${pickedram != null and pickedram == '24gb'}">24GB</option>
                    <option value="32gb" th:selected = "${pickedram != null and pickedram == '32gb'}">32GB</option>
                    <option value="48gb" th:selected = "${pickedram != null and pickedram == '48gb'}">48GB</option>
                    <option value="64gb" th:selected = "${pickedram != null and pickedram == '64gb'}">64GB</option>
                </select>
            </div>

            <div class="filter-group">
                <h4>Dung lượng lưu trữ</h4>
                <select name = "storage" style="width: 100%; padding: 8px; border-radius: 5px; background-color: #0f172a; color: white; border: 1px solid #374151;">
                    <option value="">Chọn Storage</option>
                    <option value="128gb" th:selected = "${pickStorage != null and pickStorage == '128gb'}">128GB</option>
                    <option value="256gb" th:selected = "${pickStorage != null and pickStorage == '256gb'}">256GB</option>
                    <option value="512gb" th:selected = "${pickStorage != null and pickStorage == '512gb'}">512GB</option>
                    <option value="1tb" th:selected = "${pickStorage != null and pickStorage == '1tb'}">1TB</option>
                    <option value="2tb" th:selected = "${pickStorage != null and pickStorage == '2tb'}">2TB</option>
                    <option value="4tb" th:selected = "${pickStorage != null and pickStorage == '4tb'}">4TB</option>
                </select>
            </div>
			
            <div class="filter-group">
                <h3>Đánh giá</h3>
				<select id="rating" name="rating" style="width: 100%; padding: 8px; border-radius: 5px; background-color: #0f172a; color: white; border: 1px solid #374151;">
                    <option value="">Chọn số sao</option>
                    <option value="5" th:selected = "${hasRating != null and hasRating == '5'}">5 - Xuất sắc</option>
                    <option value="4" th:selected = "${hasRating != null and hasRating == '4'}">4 - Rất tốt</option>
                    <option value="3" th:selected = "${hasRating != null and hasRating == '3'}">3 - Tốt</option>
                    <option value="2" th:selected = "${hasRating != null and hasRating == '2'}">2 - Trung bình</option>
                    <option value="1" th:selected = "${hasRating != null and hasRating == '1'}">1 - Kém</option>
                </select>
            </div>
        </aside>
 
        <!-- PRODUCTS -->
        <section class="products-section">

            <div class="products-header">
                <h2>Danh sách game</h2>
				<select class="sort-options" name="sort">
				    <option value="">Sắp xếp theo</option>
				    <option value="newest" th:selected = "${Pickedsort != null and Pickedsort=='newest'}">Mới nhất</option>
				    <option value="oldest" th:selected = "${Pickedsort != null and Pickedsort=='oldest'}">Cũ nhất</option>
				    <option value="priceAsc" th:selected = "${Pickedsort != null and Pickedsort=='priceAsc'}">Giá thấp đến cao</option>
				    <option value="priceDesc" th:selected = "${Pickedsort != null and Pickedsort=='priceDesc'}">Giá cao đến thấp</option>
				    <option value="rating" th:selected = "${Pickedsort != null and Pickedsort=='rating'}">Đánh giá cao nhất</option>
				</select>
            </div>
			
			<div class="games">
    <div class="game-card" th:each="game : ${gamePage.content}">

        <!-- Chỉ gắn link vào Ảnh -->
        <a th:href="@{/user/product-detail/{id}(id=${game.game_id})}">
            <img th:src="@{/images/{file}(file=${game.thumbnail})}">
        </a>

        <div class="game-info">
            <!-- Chỉ gắn link vào Tiêu đề -->
            <a th:href="@{/user/product-detail/{id}(id=${game.game_id})}" style="text-decoration:none;">
                <div class="game-title" th:text="${game.gameName}"></div>
            </a>

            <div class="game-rating">★★★★★ (4.8)</div>
            <div class="game-category" th:text="${categoryMap.get(game.game_id)}">Action | Sci-Fi</div>
            <div class="price-row">
                <div class="price" th:text="${#numbers.formatDecimal(game.price, 0, 'POINT', 0, 'COMMA')} + ' VND'"></div>
            </div>

            <div class="action-buttons">
                    <!-- Đã mua -->
                    <button class="download-btn"
                            th:if="${username != null && #lists.contains(gamePaidId, game.game_id)}">
                        <a th:href="@{/games/{file}(file=${game.filegame})}" style="color: green; text-decoration: none;">Tải Game</a>
                    </button>
                    
                    <!-- Đã thêm vào giỏ -->
                    <button class="download-btn"
                            th:if="${username != null
                                   && !#lists.contains(gamePaidId, game.game_id)
                                   && #lists.contains(listgame, game.game_id)}">
                        Đã có trong giỏ
                    </button>
                    
                    <!-- Chưa mua, chưa thêm -->
                    <form th:if="${game.status=='Active'
                                 && (username == null
                                     || (!#lists.contains(gamePaidId, game.game_id)
                                         && !#lists.contains(listgame, game.game_id)))}"
                          th:action="@{/user/addcart/{id}(id=${game.game_id})}"
                          method="post" style="flex: 1;">
                        <button class="cart-btn" type="submit" style="width: 100%;">
                            Thêm vào giỏ
                        </button>
                    </form>
                    
                    <!-- Sắp ra mắt -->
                    <button class="cart-btn" th:if="${game.status=='Unactive'}" style="flex: 1;">Sắp ra mắt</button>
                    
                    <!-- Danh sách yêu thích -->
                    <a th:href="@{/user/wishlist/add/{id}(id=${game.game_id})}" 
                       th:if="${username == null || !#lists.contains(wishlist, game.game_id)}">
                       <button class="wishlist-btn" title="Thêm vào yêu thích">🤍</button>
                    </a>
                    
                    <a th:href="@{/user/wishlist/add/{id}(id=${game.game_id})}" 
                       th:if="${username != null && #lists.contains(wishlist, game.game_id)}">
                       <button style="background:transparent; border:1px solid #d606910f; color:#ef4444; padding:8px 10px; border-radius:10px; cursor:pointer;" title="Bỏ yêu thích">❤️</button>
                    </a>
                </div>
        </div>
    </div>
</div>
			<!---->
            <!-- PAGINATION-->
            <div class="pagination" th:if="${gamePage.totalPages > 0}">
			    <button th:if="${!gamePage.first}" type="submit" name="page" th:value="${currentPage-1}">&lt;</button>
			    
			    <button th:each="i : ${#numbers.sequence(0, gamePage.totalPages-1)}" 
			            type="submit" name="page" th:value="${i}" 
			            th:text="${i+1}" 
			            th:classappend="${i == currentPage} ? 'active' : ''">1</button>
			            
			    <button th:if="${!gamePage.last}" type="submit" name="page" th:value="${currentPage+1}">&gt;</button>
			</div>
        </section>
    </main>
    </form>

        <div th:replace="~{fragments/footer :: footer}"></div>

	<script>
	    const priceRange = document.getElementById("priceRange");
	    const priceValue = document.getElementById("priceValue");

	    function formatPrice(value) {
	        return Number(value).toLocaleString("vi-VN") + "đ";
	    }

	    // Hiển thị ban đầu
	    priceValue.textContent = formatPrice(priceRange.value);

	    // Cập nhật khi kéo
	    priceRange.addEventListener("input", function () {
	        priceValue.textContent = formatPrice(this.value);
	    });
	</script>
</body>
</html>
