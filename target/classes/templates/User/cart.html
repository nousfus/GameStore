<!DOCTYPE html>
<html lang="vi"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - GameStore</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #0f172a;
            color: white;
        }

        /* HEADER */
        header{
            background-color: #111827;
            padding: 20px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo{
            color: #22d3ee;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a{
            text-decoration: none;
            color: #d1d5db;
            margin: 0 15px;
            transition: 0.3s;
        }

        nav a:hover{
            color: white;
        }

        .header-right{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-menu{
            background-color: #22d3ee;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-menu:hover{
            background-color: #67e8f9;
        }

        /* MAIN CONTENT */
        main{
            padding: 40px 80px;
            min-height: calc(100vh - 150px);
        }

        .page-header{
            margin-bottom: 30px;
        }

        .page-header h1{
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* TABS - CART SELECTION */
        .cart-tabs{
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #374151;
            padding-bottom: 0;
        }

        .cart-tab{
            padding: 12px 20px;
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .cart-tab:hover{
            color: #22d3ee;
        }

        .cart-tab.active{
            color: #22d3ee;
            border-bottom-color: #22d3ee;
        }

        .cart-tab .badge{
            display: inline-block;
            background-color: #ef4444;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 5px;
        }

        /* CONTAINER */
        .cart-container{
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        /* CART ITEMS */
        .cart-items{
            background-color: #111827;
            border-radius: 15px;
            border: 1px solid #374151;
            padding: 20px;
        }

        .items-header{
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #374151;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #9ca3af;
        }

        .cart-item{
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr;
            gap: 15px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #374151;
        }

        .cart-item:last-child{
            border-bottom: none;
        }

        .item-info{
            display: flex;
            gap: 15px;
        }

        .item-image{
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .item-image img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-details h3{
            font-size: 16px;
            margin-bottom: 5px;
        }

        .item-details p{
            font-size: 12px;
            color: #9ca3af;
        }

        .quantity-control{
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 5px 10px;
        }

        .quantity-control button{
            background: none;
            border: none;
            color: #22d3ee;
            cursor: pointer;
            font-weight: bold;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-control input{
            width: 35px;
            text-align: center;
            background: none;
            border: none;
            color: white;
            font-weight: bold;
        }

        .item-price{
            text-align: center;
            color: #22d3ee;
            font-weight: bold;
            font-size: 15px;
        }

        .item-total{
            text-align: center;
            color: #22d3ee;
            font-weight: bold;
            font-size: 16px;
        }

        .remove-btn{
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        .remove-btn:hover{
            color: #ef4444;
        }

        /* EMPTY CART */
        .empty-cart{
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-cart-icon{
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-cart h2{
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-cart p{
            margin-bottom: 25px;
        }

        .continue-shopping{
            display: inline-block;
            background-color: #22d3ee;
            color: black;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .continue-shopping:hover{
            background-color: #67e8f9;
        }

        /* CART SUMMARY */
        .cart-summary{
            background-color: #111827;
            border-radius: 15px;
            border: 1px solid #374151;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-title{
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #22d3ee;
        }

        .summary-row{
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-row.total{
            font-size: 18px;
            font-weight: bold;
            color: #22d3ee;
            padding-top: 12px;
            border-top: 2px solid #374151;
            margin-top: 15px;
        }

        .summary-row.discount{
            color: #10b981;
        }

        .checkout-btn{
            width: 100%;
            padding: 14px;
            background-color: #22d3ee;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        .checkout-btn:hover{
            background-color: #67e8f9;
        }

        .continue-btn{
            width: 100%;
            padding: 12px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .continue-btn:hover{
            background-color: #4b5563;
        }

        .promo-section{
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #374151;
        }

        .promo-section h4{
            font-size: 14px;
            margin-bottom: 10px;
            color: #d1d5db;
        }

        .promo-input{
            width: 100%;
            padding: 10px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            margin-bottom: 8px;
        }

        .apply-promo{
            width: 100%;
            padding: 8px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .apply-promo:hover{
            background-color: #4b5563;
        }

        /* FOOTER */
        footer{
            background-color: #111827;
            padding: 30px;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid #374151;
            margin-top: 40px;
        }

        /* RESPONSIVE */
        @media(max-width: 1024px){
            main{
                padding: 20px 40px;
            }

            .cart-container{
                grid-template-columns: 1fr;
            }

            .items-header{
                display: none;
            }

            .cart-item{
                display: flex;
                flex-direction: column;
                padding: 20px;
                border: 1px solid #374151;
                border-radius: 8px;
                background-color: #0f172a;
                margin-bottom: 15px;
            }

            .cart-summary{
                position: static;
            }
        }

        @media(max-width: 768px){
            header{
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            main{
                padding: 20px;
            }

            .page-header h1{
                font-size: 24px;
            }

            .cart-tabs{
                flex-wrap: wrap;
            }

            .cart-tab{
                padding: 10px 15px;
                font-size: 13px;
            }

            .cart-items{
                padding: 15px;
            }

            .cart-summary{
                padding: 20px;
            }
        }
		.deletecart{
			text-decoration : none;
            color : red;
            margin-left: 10px;
		}

    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <a href="/" class="logo">GameStore</a>

        <nav>
            <a href="/">Store</a>
            <a href="/user/product-list">Library</a>
            <a href="#">Community</a>
            <a href="#">News</a>
        </nav>

        <div class="header-right">
            <button class="user-menu" th:text = "${username}">Tài khoản</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <div class="page-header">
            <h1>Giỏ hàng</h1>
        </div>
        <!-- CART TABS -->
        <div class="cart-tabs">
			<form method="get">
			    <button class="cart-tab"
			            th:each="cart, stat : ${dscart}"
						th:classappend="${cart.cart_id == selectedCartId} ? ' active' : ''"
			            th:formaction="@{/user/cartitem/{id}(id=${cart.cart_id})}">
			        Giỏ hàng [[${stat.count}]]
			        <span class="badge"
			              th:text="${cartitemdao.findByCartId(cart.cart_id).size()}">
			            3
			        </span>
					<a class="deletecart"
					   th:href="@{/user/deletecart/{id}(id=${cart.cart_id})}">
					    X
					</a>			    
				</button>
			</form>            
			<a href = "/user/createcart"><button th:if = "${max < 6}" class="cart-tab" style="margin-left: auto; background-color: #1f2937; color: #22d3ee;">+ Tạo giỏ mới</button></a>
        </div>
		
        <!-- CONTAINER -->
        <div class="cart-container">

            <!-- CART ITEMS -->
            <div class="cart-items">

                <div class="items-header">
                    <span>Sản phẩm</span>
                    <span>Số lượng</span>
                    <span>Giá</span>
                    <span>Tổng cộng</span>
                    <span></span>
                </div>

                <!-- ITEM 1 -->
                <div class="cart-item"  th:each = "item :${cartitem}">
                    <div class="item-info" >
                        <div class="item-image">
                            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=300&auto=format&fit=crop">
                        </div>
                        <div class="item-details">
                            <h3 th:text = "${item.game.game_name}">Hehe</h3>
                            <p th:text = "${item.game.description}">Action | Sci-Fi</p>
                        </div>
                    </div>
                    <div class="quantity-control">
                        <button>-</button>
                        <input type="number" value="1" min="1" th:value = "${item.quantity}">
                        <button>+</button>
                    </div>
                    <div class="item-price" th:text = "${item.game.price}">aa</div>
                    <div class="item-total" th:text = "${item.game.price * item.quantity}">abc</div>
                    <button class="remove-btn">✕</button>
                </div>
            </div>

            <!-- CART SUMMARY -->
            <div class="cart-summary">

                <div class="summary-title">Tóm tắt Giỏ hàng</div>

                <div class="summary-row">
                    <span>Tổng phụ:</span>
                    <span th:text = "${total}">1.796.000đ</span>
                </div>

                <div class="summary-row discount">
                    <span>Giảm giá:</span>
                    <span th:text = "${discount}">-50.000đ</span>
                </div>

                <div class="summary-row total">
                    <span>Tổng cộng:</span>
                    <span th:text = "${total-discount}">1.746.000đ</span>
                </div>

                <a href = "/payment/process"><button class="checkout-btn">Thanh toán</button></a>
                <button class="continue-btn">Tiếp tục mua sắm</button>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 GameStore. All Rights Reserved.</p>
    </footer>

</body>
</html>
