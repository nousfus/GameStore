<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - GameStore</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020617, #0f172a 45%, #111827);
            color: #f8fafc;
            min-height: 100vh;
        }

        header {
            background: rgba(17, 24, 39, 0.95);
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            color: #22d3ee;
            font-size: 1.6rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.03em;
        }

        nav {
            display: flex;
            gap: 18px;
        }

        nav a {
            text-decoration: none;
            color: #d1d5db;
            transition: 0.3s;
        }

        nav a:hover {
            color: #22d3ee;
        }

        .header-right .user-menu {
            background: #22d3ee;
            color: #08131c;
            border: none;
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
        }

        main {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .page-header p {
            color: #94a3b8;
        }

        .cart-container {
            display: grid;
            grid-template-columns: 1.6fr 0.8fr;
            gap: 24px;
            align-items: start;
        }

        .cart-items,
        .cart-summary {
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.3);
        }

        .items-header {
            display: grid;
            grid-template-columns: 2.6fr 1.2fr 0.8fr 0.8fr 0.3fr;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #374151;
            margin-bottom: 12px;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 2.6fr 1.2fr 0.8fr 0.8fr 0.3fr;
            gap: 12px;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #374151;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .item-image {
            width: 84px;
            height: 84px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #374151;
            background: #111827;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-details h3 {
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .item-details p {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 999px;
            padding: 6px 8px;
            width: fit-content;
        }

        .quantity-control button {
            background: none;
            border: none;
            color: #22d3ee;
            cursor: pointer;
            font-weight: 700;
            width: 24px;
            height: 24px;
            font-size: 1rem;
        }

        .quantity-control input {
            width: 42px;
            text-align: center;
            background: none;
            border: none;
            color: #f8fafc;
            font-weight: 700;
            outline: none;
        }

        .item-price,
        .item-total {
            color: #22d3ee;
            font-weight: 700;
            text-align: center;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.05rem;
            transition: 0.2s ease;
        }

        .remove-btn:hover {
            color: #ef4444;
        }

        .summary-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #22d3ee;
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #374151;
            color: #d1d5db;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #22d3ee;
            border-bottom: none;
            padding-top: 16px;
        }

        .summary-row.discount {
            color: #4ade80;
        }

        .checkout-btn,
        .continue-btn {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 12px;
        }

        .checkout-btn {
            background: #22d3ee;
            color: #08131c;
        }

        .checkout-btn:hover {
            background: #67e8f9;
        }

        .continue-btn {
            background: #475569;
            color: #fff;
        }

        .continue-btn:hover {
            background: #334155;
        }

        .promo-section {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #374151;
        }

        .promo-section h4 {
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .promo-input {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 8px;
        }

        .apply-promo {
            width: 100%;
            padding: 10px 12px;
            background: #475569;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-cart .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 14px;
            text-decoration: none;
            background: #22d3ee;
            color: #08131c;
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 700;
        }

        footer {
            padding: 24px 32px;
            text-align: center;
            color: #94a3b8;
            border-top: 1px solid #374151;
            margin-top: 28px;
        }

        .deletecart {
            text-decoration: none;
            color: #f87171;
            margin-left: 10px;
            font-size: 0.9rem;
        }

        @media (max-width: 1024px) {
            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .items-header {
                display: none;
            }

            .cart-item {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 18px;
                border: 1px solid #374151;
                border-radius: 12px;
                background: rgba(255,255,255,0.02);
                margin-bottom: 12px;
            }

            .quantity-control {
                justify-content: flex-start;
            }

            .item-price, .item-total {
                text-align: left;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 16px 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="/" class="logo">GameStore</a>

        <nav>
            <a href="/">Store</a>
            <a href="/user/product-list">Library</a>
            <a href="#">Community</a>
            <a href="#">News</a>
        </nav>

        <div class="header-right">
            <button class="user-menu" th:text="${username}">Tài khoản</button>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>Giỏ hàng</h1>
            <p>Quản lý các tựa game bạn đã chọn trước khi thanh toán.</p>
        </div>

        <div class="cart-container">
            <div class="cart-items">
                <div class="items-header">
                    <span>Sản phẩm</span>
                    <span>Số lượng</span>
                    <span>Giá</span>
                    <span>Tổng</span>
                    <span></span>
                </div>

                <div class="cart-item" th:each="item : ${cartitem}">
                    <div class="item-info">
                        <div class="item-image">
                            <img th:src="@{/uploads/images/{file}(file=${item.game.thumbnail})}" alt="Game thumbnail">
                        </div>
                        <div class="item-details">
                            <h3 th:text="${item.game.game_name}">Hehe</h3>
                            <p th:text="${item.game.description}">Action | Sci-Fi</p>
                        </div>
                    </div>

                    <div class="quantity-control">
                        <button type="button">−</button>
                        <form action="/update" method="get">
                            <input type="hidden" name="cartItemId" th:value="${item.cart_item_id}">
                            <input type="hidden" name="cartid" th:value="${item.cartid}">
                            <input type="number" name="quantity" th:value="${item.quantity}" onchange="this.form.submit()">
                        </form>
                        <button type="button">+</button>
                    </div>

                    <div class="item-price" th:text="${item.game.price}">aa</div>
                    <div class="item-total" th:text="${item.game.price * item.quantity}">abc</div>
                    <button class="remove-btn" type="button">✕</button>
                </div>
            </div>

            <div class="cart-summary">
                <div class="summary-title">Tóm tắt giỏ hàng</div>

                <div class="summary-row">
                    <span>Tổng phụ</span>
                    <span th:text="${total}">1.796.000đ</span>
                </div>

                <div class="summary-row discount">
                    <span>Giảm giá</span>
                    <span th:text="${discount}">-50.000đ</span>
                </div>

                <div class="summary-row total">
                    <span>Tổng cộng</span>
                    <span th:text="${#numbers.formatDecimal(total - discount, 0, 'COMMA', 0, 'POINT')}">0</span>
                </div>

                <a href="/payment/process"><button class="checkout-btn">Thanh toán</button></a>
                <button class="continue-btn">Tiếp tục mua sắm</button>

                <div class="promo-section">
                    <h4>Mã giảm giá</h4>
                    <input class="promo-input" type="text" placeholder="Nhập mã khuyến mãi" />
                    <button class="apply-promo">Áp dụng</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 GameStore. All Rights Reserved.</p>
    </footer>
</body>
</html>
