<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin Cá nhân - GameStore</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #0f172a;
            color: white;
        }

        /* HEADER */
        header{
            background-color: #111827;
            padding: 20px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo{
            color: #22d3ee;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a{
            text-decoration: none;
            color: #d1d5db;
            margin: 0 15px;
            transition: 0.3s;
        }

        nav a:hover{
            color: white;
        }

        .header-right{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-menu{
            background-color: #22d3ee;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-menu:hover{
            background-color: #67e8f9;
        }

        /* MAIN CONTENT */
        main{
            padding: 40px 80px;
            min-height: calc(100vh - 150px);
        }

        .page-header{
            margin-bottom: 30px;
        }

        .page-header h1{
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* CONTAINER */
        .profile-container{
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
        }

        /* SIDEBAR - MENU */
        .sidebar{
            background-color: #111827;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #374151;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar h3{
            color: #22d3ee;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .menu-item{
            padding: 12px 15px;
            margin-bottom: 8px;
            background: none;
            border: none;
            color: #d1d5db;
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            width: 100%;
            font-size: 14px;
        }

        .menu-item:hover, .menu-item.active{
            background-color: #1f2937;
            color: #22d3ee;
        }

        /* CONTENT SECTION */
        .content-section{
            background-color: #111827;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #374151;
        }

        .section-title{
            font-size: 24px;
            margin-bottom: 25px;
            color: #22d3ee;
        }

        /* FORM GROUPS */
        .form-row{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row.full{
            grid-template-columns: 1fr;
        }

        .form-group{
            display: flex;
            flex-direction: column;
        }

        .form-group label{
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #d1d5db;
        }

        .form-group input, .form-group select, .form-group textarea{
            padding: 12px 15px;
            border: 1px solid #374151;
            border-radius: 8px;
            background-color: #1f2937;
            color: white;
            outline: none;
            transition: 0.3s;
            font-family: Arial, Helvetica, sans-serif;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus{
            border-color: #22d3ee;
            background-color: #0f172a;
        }

        .form-group textarea{
            resize: vertical;
            min-height: 100px;
        }

        /* PROFILE PICTURE */
        .profile-picture-section{
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #374151;
        }

        .profile-picture{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #22d3ee;
        }

        .upload-btn{
            display: inline-block;
            padding: 10px 25px;
            background-color: #22d3ee;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-btn:hover{
            background-color: #67e8f9;
        }

        .upload-input{
            display: none;
        }

        /* BUTTONS */
        .button-group{
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #374151;
        }

        .btn{
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary{
            background-color: #22d3ee;
            color: black;
        }

        .btn-primary:hover{
            background-color: #67e8f9;
        }

        .btn-secondary{
            background-color: #374151;
            color: white;
        }

        .btn-secondary:hover{
            background-color: #4b5563;
        }

        .btn-danger{
            background-color: transparent;
            border: 2px solid #ef4444;
            color: #ef4444;
        }

        .btn-danger:hover{
            background-color: #ef4444;
            color: white;
        }

        /* ALERTS */
        .alert{
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert.success{
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #10b981;
        }

        .alert.error{
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .alert.warning{
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }

        /* FOOTER */
        footer{
            background-color: #111827;
            padding: 30px;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid #374151;
            margin-top: 40px;
        }

        /* RESPONSIVE */
        @media(max-width: 1024px){
            main{
                padding: 20px 40px;
            }

            .profile-container{
                grid-template-columns: 1fr;
            }

            .sidebar{
                position: static;
                display: flex;
                flex-direction: column;
            }

            .form-row{
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 768px){
            header{
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            main{
                padding: 20px;
            }

            .page-header h1{
                font-size: 24px;
            }

            .content-section{
                padding: 20px;
            }

            .button-group{
                flex-direction: column;
            }

            .section-title{
                font-size: 20px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <a href="/" class="logo">GameStore</a>

        <nav>
            <a href="/">Store</a>
            <a href="/user/product-list">Library</a>
            <a href="#">Community</a>
            <a href="#">News</a>
        </nav>

        <div class="header-right">
            <button class="user-menu">Tài khoản</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <div class="page-header">
            <h1>Thông tin Cá nhân</h1>
        </div>

        <div class="profile-container">

            <!-- SIDEBAR -->
            <aside class="sidebar">
                <h3>Quản lý tài khoản</h3>
				<button class="menu-item" active>Thông tin cá nhân</button>
                <a href = "/user/change-password"><button class="menu-item">Đổi mật khẩu</button></a>
                <a href = "/history"><button class="menu-item">Lịch sử mua hàng</button></a>
                <a href = "/user/notification"><button class="menu-item">Quản lý thông báo</button></a>
                <a href = ""><button class="menu-item">Danh sách ưa thích</button></a>
            </aside>

            <!-- CONTENT -->
            <div class="content-section">

                <h2 class="section-title">Hồ sơ Cá nhân</h2>

                <!-- PROFILE PICTURE -->
                <div class="profile-picture-section">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=400&auto=format&fit=crop" alt="Avatar" class="profile-picture">
                    <div>
                        <input type="file" class="upload-input" accept="image/*">
                        <button class="upload-btn" onclick="document.querySelector('.upload-input').click()">Thay đổi ảnh</button>
                    </div>
                </div>
	
                <!-- FORM -->
                <form>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fullname">Họ và Tên</label>
                            <input type="text" id="fullname" name="fullname" th:value="${user.fullname}" required>
                        </div>
                        <div class="form-group">
                            <label for="username">Tên đăng nhập</label>
                            <input type="text" id="username" name="username" th:value="${user.username}" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" th:value="${user.email}" required>
                        </div>
						<div class="form-group">
						     <label for="dob">Ngày tạo</label>
						     <input type="date" id="dob" name="dob" th:value="${user.createdDate}" disabled>
						 </div>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                        <button type="button" class="btn btn-danger" onclick="if(confirm('Bạn chắc chắn muốn xóa tài khoản?')) { alert('Yêu cầu xóa tài khoản đã gửi'); }">Xóa tài khoản</button>
                    </div>

                </form>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 GameStore. All Rights Reserved.</p>
    </footer>

</body>
</html>
