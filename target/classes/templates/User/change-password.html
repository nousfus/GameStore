<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - GameStore</title>

    <style>
        /* Reused project styles (minimal subset) */
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
        body{background:#0f172a;color:#fff}
        header{background:#111827;padding:20px 80px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}
        .logo{color:#22d3ee;font-size:28px;font-weight:bold;text-decoration:none}
        nav a{color:#d1d5db;margin:0 12px;text-decoration:none}
        main{padding:40px 80px}
        .content-section{background:#111827;padding:30px;border-radius:12px;border:1px solid #374151}
        .section-title{color:#22d3ee;font-size:22px;margin-bottom:20px}
        .form-group{display:flex;flex-direction:column;margin-bottom:15px}
        .form-group label{margin-bottom:8px;color:#d1d5db;font-weight:600}
        .form-group input{padding:12px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff;outline:none}
        .form-group input:focus{border-color:#22d3ee;background:#0f172a}
        .btn{padding:12px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
        .btn-primary{background:#22d3ee;color:#000}
        .btn-secondary{background:#374151;color:#fff}
        footer{background:#111827;padding:30px;text-align:center;color:#9ca3af;margin-top:40px}
        @media(max-width:768px){header{padding:16px}main{padding:20px}}
        /* SIDEBAR + LAYOUT (reused from profile) */
        .profile-container{display:grid;grid-template-columns:250px 1fr;gap:30px}
        .sidebar{background-color:#111827;padding:20px;border-radius:15px;border:1px solid #374151;height:fit-content;position:sticky;top:100px}
        .sidebar h3{color:#22d3ee;margin-bottom:20px;font-size:16px}
        .menu-item{padding:12px 15px;margin-bottom:8px;background:none;border:none;color:#d1d5db;text-align:left;cursor:pointer;border-radius:8px;transition:0.3s;width:100%;font-size:14px}
        .menu-item:hover, .menu-item.active{background-color:#1f2937;color:#22d3ee}
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">GameStore</a>
        <nav>
            <a href="/">Store</a>
            <a href="/user/product-list">Library</a>
        </nav>
        <div class="header-right">
            <button class="user-menu">Tài khoản</button>
            </div>

        </div>
    </header>

    <main>
        <div class="profile-container">

            <!-- SIDEBAR -->
            <aside class="sidebar">
                <h3>Quản lý tài khoản</h3>
                <a href="/user/profile"><button class="menu-item">Thông tin cá nhân</button></a>
                <a href="/user/change-password"><button class="menu-item active">Đổi mật khẩu</button></a>
                <a href="/user/history-purchase"><button class="menu-item">Lịch sử mua hàng</button></a>
                <a href="/user/notifications"><button class="menu-item">Quản lý thông báo</button></a>
            </aside>

            <div class="content-section">
            <h2 class="section-title">Đổi Mật Khẩu</h2>

            <form th:action="@{/user/change-password}" method="post">
                <div class="form-group">
                    <label for="currentPassword">Mật khẩu hiện tại</label>
                    <input type= "password" id="currentPassword" name="currentPassword" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <div style="display:flex;gap:12px;margin-top:12px">
                    <button type="submit" class="btn btn-primary">Cập nhật mật khẩu</button>
                    <a href="/user/profile" class="btn btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Hủy</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 GameStore. All Rights Reserved.</p>
    </footer>
</body>
</html>
