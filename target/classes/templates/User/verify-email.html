<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Email - GameStore</title>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
        body{background:#0f172a;color:#fff}
        header{background:#111827;padding:20px 80px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}
        .logo{color:#22d3ee;font-size:28px;font-weight:bold;text-decoration:none}
        nav a{color:#d1d5db;margin:0 12px;text-decoration:none}
        main{padding:40px 80px}
        .content-section{background:#111827;padding:30px;border-radius:12px;border:1px solid #374151}
        .section-title{color:#22d3ee;font-size:22px;margin-bottom:20px}
        .form-group{display:flex;flex-direction:column;margin-bottom:15px}
        .form-group label{margin-bottom:8px;color:#d1d5db;font-weight:600}
        .form-group input{padding:12px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff;outline:none}
        .form-group input:focus{border-color:#22d3ee;background:#0f172a}
        .btn{padding:12px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
        .btn-primary{background:#22d3ee;color:#000}
        .btn-secondary{background:#374151;color:#fff}
        footer{background:#111827;padding:30px;text-align:center;color:#9ca3af;margin-top:40px}
        @media(max-width:768px){header{padding:16px}main{padding:20px}}
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">GameStore</a>
        <nav>
            <a href="/">Store</a>
            <a href="/user/product-list">Library</a>
        </nav>
        <div class="header-right">
            <button class="user-menu">Tài khoản</button>
        </div>
    </header>

    <main>
        <div class="content-section">
            <h2 class="section-title">Xác thực Email</h2>

            <!-- Step 2: Nhập mã xác nhận -->
            <form th:action="@{/verify-get}" method="post">
                <div class="form-group">
                    <label for="code">Nhập vào mã xác nhận đã gửi đến email của bạn</label>
                    <input type="text" id="code" name="code" maxlength="10" required>
                </div>
                <div style="display:flex;gap:12px">
                    <button type="submit" class="btn btn-primary">Xác nhận</button>
                    <a href = "/resend"><button type="button" onclick="document.getElementById('email').focus()" class="btn btn-secondary"  id="resendBtn" disabled>Gửi lại mã (10s)</button></a>
                </div>
            </form>

        </div>
    </main>
	<script>
	    let timeLeft = 10;
	    const btn = document.getElementById("resendBtn");

	    const countdown = setInterval(() => {
	        timeLeft--;

	        btn.textContent = `Gửi lại mã (${timeLeft}s)`;

	        if (timeLeft <= 0) {
	            clearInterval(countdown);
	            btn.disabled = false;
	            btn.textContent = "Gửi lại mã";
	        }
	    }, 1000);
	</script>
    <footer>
        <p>© 2026 GameStore. All Rights Reserved.</p>
    </footer>
</body>
</html>
