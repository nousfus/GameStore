<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Nội dung - Admin</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#0f172a;color:#fff}header{background:#111827;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}.logo{color:#22d3ee;font-weight:bold}.card{background:#111827;padding:20px;border-radius:10px;border:1px solid #374151}textarea{width:100%;min-height:120px;padding:10px;background:#0f172a;border:1px solid #374151;color:#fff;border-radius:6px}
    </style>
</head>
<body>
<header><div class="logo">GameStore Admin</div></header>
<main style="padding:30px">
    <h1>Quản lý Nội dung</h1>
    <div class="card">
        <p style="color:#9ca3af;margin-bottom:12px">Tạo / Sửa bài viết, thông báo, nội dung landing page</p>
        <div style="margin-bottom:12px">
            <input placeholder="Tiêu đề" style="width:100%;padding:10px;border-radius:6px;background:#0f172a;border:1px solid #374151;color:#fff;margin-bottom:8px">
            <textarea placeholder="Nội dung..."></textarea>
            <div style="margin-top:8px;text-align:right"><button>Đăng</button></div>
        </div>
    </div>
</main>
<footer style="background:#111827;padding:20px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
