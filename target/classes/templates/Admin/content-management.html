<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Nội dung - Admin</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#0f172a;color:#fff}header{background:#111827;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}.logo{color:#22d3ee;font-weight:bold}.card{background:#111827;padding:20px;border-radius:10px;border:1px solid #374151}textarea{width:100%;min-height:120px;padding:10px;background:#0f172a;border:1px solid #374151;color:#fff;border-radius:6px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:10px;border-bottom:1px solid #374151;text-align:left;color:#d1d5db}button{padding:8px 12px;border-radius:6px;border:none;cursor:pointer;background:#22d3ee;color:#000}
    </style>
</head>
<body>
<header><div class="logo">GameStore Admin</div></header>
<main style="padding:30px">
    <h1>Quản lý Nội dung</h1>

    <div class="card" style="margin-top:16px">
        <h3 style="margin-bottom:8px">Danh sách Game</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Tên</th>
                    <th>Giá</th>
                    <th>Thumbnail</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="game : ${listgame}">
                    <td th:text="${game.game_id}">101</td>
                    <td th:text="${game.game_name}">Tên game</td>
                    <td th:text="${game.price}">0</td>
                    <td>
                        <img th:if="${game.thumbnail != null}" th:src="@{/uploads/images/{file}(file=${game.thumbnail})}" width="100">
                    </td>
                    <td th:text="${game.status}">Active</td>
                    <td>
                        <a th:href="@{/admin/games/edit/{id}(id=${game.game_id})}"><button type="button">Phê duyệt</button></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer style="background:#111827;padding:20px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
