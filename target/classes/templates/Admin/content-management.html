<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Nội dung - Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(180deg,#020617 0%, #071028 40%, #0f172a 100%); color: #e6eef6; font-family: Inter, Arial, Helvetica, sans-serif; }
        header { background: rgba(4,6,29,0.9); padding: 18px 40px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(148,163,184,0.04); }
        .logo { color:#22d3ee; font-weight:800; }

        main { max-width:1200px; margin: 28px auto; padding: 0 20px 40px; }
        h1 { margin-bottom:10px; }

        .card { background: rgba(2,6,23,0.6); padding:18px; border-radius:12px; border:1px solid rgba(148,163,184,0.04); box-shadow: 0 12px 30px rgba(2,6,23,0.45); }

        .controls { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
        .controls .search { flex:1; }
        .controls input.search-box { width:100%; padding:10px 12px; border-radius:999px; border:1px solid rgba(148,163,184,0.04); background:rgba(4,8,20,0.6); color:#dff6fb; }
        .controls .btn-primary { background: linear-gradient(90deg,#22d3ee,#38bdf8); color:#041017; padding:10px 14px; border-radius:999px; border:none; font-weight:800; cursor:pointer; }

        .table { width:100%; border-collapse: collapse; margin-top:8px; }
        .table th { text-align:left; padding:12px; font-size:13px; color:#94a3b8; border-bottom:1px solid rgba(148,163,184,0.03); }
        .table td { padding:12px; vertical-align:middle; border-bottom:1px dashed rgba(148,163,184,0.03); color:#dff6fb; }

        .game-thumb { width:96px; height:56px; object-fit:cover; border-radius:8px; border:1px solid rgba(148,163,184,0.04); }

        .row-actions { display:flex; gap:8px; }
        .action-btn { padding:8px 10px; border-radius:8px; border:none; cursor:pointer; font-weight:700; }
        .action-approve { background:transparent; color:#67e8f9; border:1px solid rgba(103,232,249,0.06); }
        .action-edit { background:transparent; color:#fbbf24; border:1px solid rgba(251,191,36,0.06); }
        .action-delete { background:transparent; color:#fb7185; border:1px solid rgba(251,113,133,0.06); }

        @media (max-width:900px) {
            .table, thead, tbody, th, td, tr { display:block; }
            thead { display:none; }
            .table td { display:flex; justify-content:space-between; padding:12px 8px; }
        }
    </style>
</head>
<body>
<header><div class="logo">GameStore Admin</div></header>
<main style="padding:30px">
    <h1>Quản lý Nội dung</h1>

    <div class="card" style="margin-top:16px">
        <div class="controls">
            <div class="search"><input class="search-box" type="text" placeholder="Tìm kiếm theo tên, id..." /></div>
            <button class="btn-primary">Tìm kiếm game</button>
        </div>

        <h3 style="margin-bottom:8px">Danh sách Game</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Tên</th>
                    <th>Giá</th>
                    <th>Thumbnail</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="game : ${listgame}" class="user-row">
                    <td th:text="${game.game_id}">101</td>
                    <td th:text="${game.game_name}">Tên game</td>
                    <td th:text="${game.price}">0</td>
                    <td>
                        <img th:if="${game.thumbnail != null}" th:src="@{/uploads/images/{file}(file=${game.thumbnail})}" class="game-thumb">
                    </td>
                    <td>
                        <span th:if="${game.status=='Active'}" class="badge badge-role">Active</span>
                        <span th:if="${game.status!='Active'}" class="badge badge-inactive" th:text="${game.status}">Inactive</span>
                    </td>
                    <td>
                        <div class="row-actions">
                            <a th:href="@{/admin/games/edit/{id}(id=${game.game_id})}"><button class="action-btn action-approve" type="button">Phê duyệt</button></a>
                            <a th:href="@{/admin/games/manage/{id}(id=${game.game_id})}"><button class="action-btn action-edit" type="button">Sửa</button></a>
                            <form method="post" th:action="@{/admin/games/delete}" style="display:inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa game này?')">
                                <input type="hidden" name="id" th:value="${game.game_id}" />
                                <button type="submit" class="action-btn action-delete">Xóa</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listgame)}">
                    <td colspan="6" style="text-align:center;color:#9ca3af;padding:20px">Không tìm thấy game nào.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer style="background:#111827;padding:20px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
