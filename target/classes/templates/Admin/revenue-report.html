<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thống kê Doanh thu - Admin</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#0f172a;color:#fff}header{background:#111827;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}.logo{color:#22d3ee;font-weight:bold}.card{background:#111827;padding:20px;border-radius:10px;border:1px solid #374151}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}.metric{padding:18px;border-radius:8px;background:#0f172a;border:1px solid #374151}.chart{height:300px;background:linear-gradient(180deg,#0f172a,#0b1220);border-radius:8px;border:1px solid #374151}
    </style>
</head>
<body>
<header>
    <div class="logo">GameStore Admin</div>
</header>
<main style="padding:30px">
    <h1 style="margin-bottom:12px">Thống kê Doanh thu</h1>
    <div class="card">
        <div class="grid">
            <div class="metric">Tổng doanh thu<br><strong style="font-size:20px;color:#22d3ee">12.345.000đ</strong></div>
            <div class="metric">Đơn hàng hôm nay<br><strong style="font-size:20px;color:#22d3ee">128</strong></div>
            <div class="metric">Người mua mới<br><strong style="font-size:20px;color:#22d3ee">42</strong></div>
        </div>
        <div class="chart">[Biểu đồ doanh thu - placeholder]</div>
    </div>
</main>
<footer style="background:#111827;padding:20px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
