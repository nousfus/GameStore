<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gửi Thông báo - Nhân viên</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#0f172a;color:#fff}header{background:#111827;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}.logo{color:#22d3ee;font-weight:bold}.card{background:#111827;padding:20px;border-radius:10px;border:1px solid #374151}input,textarea{width:100%;padding:10px;border-radius:6px;background:#0f172a;border:1px solid #374151;color:#fff;margin-bottom:8px}
    </style>
</head>
<body>
<header><div class="logo">GameStore Staff</div></header>
<main style="padding:30px">
    <h1>Gửi Thông báo</h1>
    <div class="card">
        <p style="color:#9ca3af;margin-bottom:12px">Soạn và gửi thông báo tới người dùng</p>
        <input placeholder="Tiêu đề thông báo">
        <textarea placeholder="Nội dung thông báo"></textarea>
        <div style="text-align:right"><button>Gửi</button></div>
    </div>
</main>
<footer style="background:#111827;padding:20px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
