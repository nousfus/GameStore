<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Order
    <table border = 1>
        <thead>
            <tr>
                <th>Username</th>
				<th>created date</th>
                <th>Tổng số lượng</th>
				<th>Trạng thái</th>
				<th>Actions</th>
            </tr>
        </thead>
        <tbody>
             <tr th:each = "item :${dsorder}">
                <td th:text = "${item.username}">Username</td>
				<td th:text = "${item.order_date}">created date</td>
                <td th:text = "${item.total_amount}">Tổng số lượng</td>
				<td th:text = "${item.status}">Trạng thái</td>
				<td th:if="${'Pending'.equals(item.status)}">
				    <a th:href="@{/pending/{id}(id=${item.order_id})}">
				        Giao hàng
				    </a>
				</td>          
			</tr>
        </tbody>
    </table>

    Order details
    <table border = 1>
        <thead>
            <tr>
                <th>orderid</th>
				<th>gameid</th>
                <th>gia</th>
                <th>giamgia</th>
            </tr>
        </thead>
        <tbody>
             <tr th:each = "item :${dsorderdetail}">
                <td th:text = "${item.order_id}">orderid</td>
				<td th:text = "${item.game_id}">gameid</td>
                <td th:text = "${item.price}">gia</td>
                <td th:text = "${item.discount_amount}">giamgia</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
