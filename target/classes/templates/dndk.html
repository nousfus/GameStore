<!DOCTYPE html>
<html>
<head>
<style>

.form{
    display: none;
    margin-top: 20px;
}
#loginTab:checked ~ #loginForm{
    display: block;
}

#registerTab:checked ~ #registerForm{
    display: block;
}

label{
    padding: 10px;
    background: lightgray;
    cursor: pointer;
}
input{
	width: 200px;
}

</style>
</head>
<body>
<h2 th:text = "${a}"></h2>
<!-- Radio -->
<input type="radio" name="tab" id="loginTab" checked hidden>
<input type="radio" name="tab" id="registerTab" hidden>

<!-- Tab buttons -->
<label for="loginTab">Đăng nhập</label>
<label for="registerTab">Đăng ký</label>

<!-- Form login -->
<div id="loginForm" class="form">
	<form action = "/check" method = "post">
    <h2>Form Đăng nhập</h2>
    <input type="text" placeholder="Username hoặc email" name ="username_dn"><br>
	<input type = "password" placeholder="Mật khẩu" name="password_dn"><br/>
	<button>Đăng nhập</button>
	</form>
</div>

<!-- Form register -->
<div id="registerForm" class="form">
    <h2>Form Đăng ký</h2>
	<form action = "/dk" method = "post">
	<input placeholder="Nhập vào tên người dùng" name = "fullname"><br/>
	<input placeholder="Username" name ="username"><br/>
    <input type="email" placeholder="Email" name = "email"><br/>
	<input type ="password" placeholder="Mật khẩu" name = "password"><br/>
	<input type ="password" placeholder="Nhập lại mật khẩu" name = "password2"><br/>
	<button>Đăng ký</button>
	</form>
</div>
	<h2 th:text = "${kq}"></h2>
</body>
</html>
