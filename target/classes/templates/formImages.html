<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Video</title>
</head>
<body>
<form action="/upload-images"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="images"
           accept="image/*"
           multiple>

    <button type="submit">Upload</button>
</form>
</body>
</html>
