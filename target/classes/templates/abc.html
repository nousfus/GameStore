<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
       <button>Chọn video game</button>
	   <button>Chọn ảnh game</button>
	   
	   <h2>Chọn video trailer</h2>
	   	<form action="/gameVideos"
	   		      method="post"
	   		      enctype="multipart/form-data">
	   		    <input type="file" name="video" accept="video/*">
	   		    <button type="submit">Upload</button>
	   		</form>

	       <h2>Chọn ảnh game</h2>
	   	<form action="/gameImages"
	   	      method="post"
	   	      enctype="multipart/form-data">

	   	    <input type="file"
	   	           name="images"
	   	           accept="image/*"
	   	           multiple>

	   	    <button type="submit">Upload</button>
	   	</form>
</body>
</html>
