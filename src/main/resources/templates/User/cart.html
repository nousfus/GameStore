<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <title>Giỏ hàng - GameStore</title>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #0f172a; color: white; }

    .cart-page { padding: 40px 80px; min-height: calc(100vh - 200px); }
    .page-header { margin-bottom: 30px; }
    .page-header h1 { font-size: 32px; margin-bottom: 8px; color: #fff; }
    .page-header p { color: #9ca3af; font-size: 14px; }

    .cart-container { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; align-items: start; }
    
    /* Danh sách sản phẩm */
    .cart-items { background-color: #111827; padding: 24px; border-radius: 12px; border: 1px solid #374151; }
    .items-header { display: flex; justify-content: space-between; color: #9ca3af; font-size: 14px; padding-bottom: 15px; border-bottom: 1px solid #374151; margin-bottom: 20px; font-weight: bold; }
    
    .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #1f2937; gap: 15px; }
    .cart-item:last-child { border-bottom: none; }
    
    .item-info { display: flex; align-items: center; gap: 15px; flex: 1; }
    .item-image img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: #1f2937; }
    .item-details h3 { font-size: 16px; color: white; margin-bottom: 4px; }
    .item-details p { font-size: 13px; color: #9ca3af; }
    
    .item-total { font-size: 16px; font-weight: bold; color: #22d3ee; min-width: 100px; text-align: right; }
    
    /* Nút xóa */
    .remove-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s; }
    .remove-btn:hover { background: #ef4444; color: white; }

    /* Khung tóm tắt */
    .cart-summary { background-color: #111827; padding: 24px; border-radius: 12px; border: 1px solid #374151; position: sticky; top: 100px; }
    .summary-title { font-size: 18px; font-weight: bold; color: #22d3ee; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #374151; }
    
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 14px; color: #d1d5db; font-size: 15px; }
    .summary-row.discount { color: #10b981; }
    .summary-row.total { font-size: 18px; font-weight: bold; color: white; border-top: 1px solid #374151; padding-top: 14px; margin-top: 14px; }
    
    /* Các nút hành động */
    .checkout-btn { width: 100%; background-color: #22d3ee; color: #0f172a; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
    .checkout-btn:hover { background-color: #67e8f9; }
    
    .continue-btn { width: 100%; background-color: #374151; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .continue-btn:hover { background-color: #4b5563; }

    @media(max-width: 900px) {
        .cart-container { grid-template-columns: 1fr; }
        .cart-page { padding: 20px; }
    }
</style>
</head>

<body>
    
    <div th:replace="~{fragments/header-user :: header-user}"></div>

    <main class="cart-page">
        <div class="page-header">
            <h1>Giỏ hàng</h1>
            <p>Quản lý các tựa game bạn đã chọn trước khi thanh toán.</p>
        </div>

        <div class="cart-container">
            <div class="cart-items">
                <div class="items-header">
                    <span>Sản phẩm</span>
                    <span>Giá</span>
                    <span></span>
                </div>

                <div class="cart-item" th:each="item : ${cartitem}">
                    <div class="item-info">
                        <div class="item-image">
                            <img th:src="@{/images/{file}(file=${item.game.thumbnail})}" alt="Game thumbnail">
                        </div>
                        <div class="item-details">
                            <h3 th:text="${item.game.gameName}">Hehe</h3>
                            <p th:text="${item.game.description}">Action | Sci-Fi</p>
                        </div>
                    </div>

                    <div class="item-total" th:text="${item.game.price}">aa</div>
					<button type="button" class="remove-btn"
					        th:onclick="|location.href='@{/delete/{id}(id=${item.cart_item_id})}'|">
					    ✕
					</button>					
                </div>
            </div>

            <div class="cart-summary">
                <div class="summary-title">Tóm tắt giỏ hàng</div>

                <div class="summary-row">
                    <span>Tổng phụ</span>
                    <span th:text="${total}">1.796.000đ</span>
                </div>

                <div class="summary-row discount">
                    <span>Giảm giá</span>
                    <span th:text="${discount}">-50.000đ</span>
                </div>

                <div class="summary-row total">
                    <span>Tổng cộng</span>
                    <span th:text="${#numbers.formatDecimal(total - discount, 0, 'COMMA', 0, 'POINT')}">0</span>
                </div>

                <a href="/thanhtoan"><button class="checkout-btn">Thanh toán</button></a>
                <a href = "/user/product-list"><button class="continue-btn">Tiếp tục mua sắm</button></a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
<script>
const cart = JSON.parse(localStorage.getItem("cart")) || [];
</script>
</body>
</html>
