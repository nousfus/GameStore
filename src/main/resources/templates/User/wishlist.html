<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách yêu thích - GameStore</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #0f172a;
            color: white;
        }

        /* HEADER */
        header{
            background-color: #111827;
            padding: 20px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo{
            color: #22d3ee;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a{
            text-decoration: none;
            color: #d1d5db;
            margin: 0 15px;
            transition: 0.3s;
        }

        nav a:hover{
            color: white;
        }

        .header-right{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-menu{
            background-color: #22d3ee;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-menu:hover{
            background-color: #67e8f9;
        }

        /* MAIN CONTENT */
        main{
            padding: 40px 80px;
            min-height: calc(100vh - 150px);
        }

        .page-header{
            margin-bottom: 30px;
        }

        .page-header h1{
            font-size: 32px;
            margin-bottom: 10px;
        }

        .wishlist-count{
            color: #9ca3af;
            font-size: 16px;
        }

        /* FILTER & SORT */
        .controls{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #111827;
            border-radius: 10px;
            border: 1px solid #374151;
        }

        .sort-section{
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .sort-select, .filter-select{
            padding: 10px 15px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        /* WISHLIST ITEMS */
        .wishlist-container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .wishlist-item{
background-color: #111827;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid #374151;
        }

        .wishlist-item:hover{
            transform: translateY(-8px);
            border-color: #22d3ee;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
        }

        .item-image{
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
        }

        .item-image img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
		a{
			text-decoration : none;
		}

        .wishlist-badge{
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ef4444;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .item-info{
            padding: 20px;
        }

        .item-title{
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-rating{
            font-size: 14px;
            color: #fbbf24;
            margin-bottom: 10px;
        }

        .item-category{
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .item-price{
            font-size: 20px;
            color: #22d3ee;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .item-actions{
            display: flex;
            gap: 10px;
        }

        .action-btn{
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .cart-btn{
            background-color: #22d3ee;
            color: black;
        }

        .cart-btn:hover{
            background-color: #67e8f9;
        }

        .remove-btn{
            background-color: #374151;
            color: white;
        }

        .remove-btn:hover{
            background-color: #ef4444;
            color: white;
        }

        /* EMPTY STATE */
        .empty-state{
            text-align: center;
            padding: 60px 20px;
            background-color: #111827;
            border-radius: 15px;
            border: 2px dashed #374151;
        }

        .empty-state-icon{
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-state h2{
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p{
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .back-btn{
            display: inline-block;
            background-color: #22d3ee;
            color: black;
padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover{
            background-color: #67e8f9;
        }

        /* PAGINATION */
        .pagination{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button{
            padding: 10px 15px;
            background-color: #1f2937;
            color: white;
            border: 1px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pagination button:hover, .pagination button.active{
            background-color: #22d3ee;
            color: black;
            border-color: #22d3ee;
        }
        
        /* FOOTER */
        footer{
            background-color: #111827;
            padding: 30px;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid #374151;
            margin-top: 40px;
        }

        /* RESPONSIVE */
        @media(max-width: 1024px){
            main{
                padding: 20px 40px;
            }

            .wishlist-container{
                grid-template-columns: repeat(2, 1fr);
            }

            .controls{
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }

        @media(max-width: 768px){
            header{
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            main{
                padding: 20px;
            }

            .wishlist-container{
                grid-template-columns: 1fr;
            }

            .page-header h1{
                font-size: 24px;
            }

            .controls{
                padding: 15px;
            }

            .sort-section{
                width: 100%;
                flex-direction: column;
            }

            .sort-select, .filter-select{
                width: 100%;
            }
        }
        
         /* FOOTER */
        footer{
            background-color: #111827;
            padding: 30px;
            text-align: center;
            color: #9ca3af;
            margin-top: 40px;
        }
        .site-footer {
		    background-color: #0b0f19; /* Nền tối đậm hơn body tạo chiều sâu */
		    border-top: 1px solid #1e293b;
		    padding: 60px 0 20px 0;
		    margin-top: 80px;
		    font-size: 14px;
		    color: #94a3b8; /* Màu chữ xám nhạt dễ đọc */
		}
		
		.footer-container {
		    max-width: 1200px;
		    margin: 0 auto;
		    padding: 0 40px;
		    display: grid;
		    grid-template-columns: 2fr 1fr 1.5fr 2fr; /* Chia tỉ lệ 4 cột */
		    gap: 40px;
		}
		
		.footer-column h4 {
color: #22d3ee; /* Tông màu xanh Cyan đồng bộ với Logo */
		    font-size: 18px;
		    font-weight: bold;
		    margin-bottom: 20px;
		    position: relative;
		    padding-bottom: 8px;
		}
		
		/* Đường gạch chân trang trí dưới tiêu đề mỗi cột */
		.footer-column h4::after {
		    content: '';
		    position: absolute;
		    left: 0;
		    bottom: 0;
		    width: 35px;
		    height: 2px;
		    background-color: #22d3ee;
		}
		
		.footer-column p {
		    line-height: 1.6;
		    margin-bottom: 15px;
		}
		
		.footer-column ul {
		    list-style: none;
		    padding: 0;
		    margin: 0;
		}
		
		.footer-column ul li {
		    margin-bottom: 12px;
		}
		
		.footer-column ul li a {
		    color: #94a3b8;
		    text-decoration: none;
		    transition: all 0.3s ease;
		    display: inline-block;
		}
		
		/* Hiệu ứng hover dịch chuyển nhẹ và đổi màu chữ sang trắng */
		.footer-column ul li a:hover {
		    color: #ffffff;
		    padding-left: 6px;
		}
		
		/* Cấu hình danh sách thông tin liên hệ */
		.contact-info li {
		    display: flex;
		    align-items: flex-start;
		    gap: 10px;
		    line-height: 1.5;
		}
		
		.info-icon {
		    color: #22d3ee;
		}
		
		/* Các nút liên kết mạng xã hội */
		.footer-socials {
		    display: flex;
		    gap: 10px;
		    margin-top: 20px;
		}
		
		.social-icon {
		    color: #94a3b8;
		    text-decoration: none;
		    padding: 8px 16px;
		    background-color: #1e293b;
		    border-radius: 6px;
		    font-weight: 500;
		    font-size: 13px;
		    transition: all 0.3s ease;
		}
		
		.social-icon:hover {
		    color: #0f172a;
		    background-color: #22d3ee;
		    transform: translateY(-3px); /* Nhấc nhẹ nút lên khi hover */
		}
		
		/* Form đăng ký nhận bản tin */
		.newsletter-form {
		    display: flex;
		    gap: 8px;
		    margin-top: 15px;
		}
		
		.newsletter-form input {
		    flex: 1;
		    padding: 10px 14px;
		    background-color: #1e293b;
		    border: 1px solid #334155;
		    border-radius: 6px;
		    color: #ffffff;
		    outline: none;
		    font-size: 13px;
		    transition: border-color 0.3s ease;
		}
		
		.newsletter-form input:focus {
		    border-color: #22d3ee;
		}
		
		.newsletter-form button {
		    background-color: #22d3ee;
		    color: #0f172a;
		    border: none;
		    padding: 10px 18px;
		    border-radius: 6px;
		    font-weight: bold;
		    cursor: pointer;
		    font-size: 13px;
		    transition: background-color 0.3s ease;
		}
		
		.newsletter-form button:hover {
		    background-color: #06b6d4;
		}
		
		/* Khu vực hàng bản quyền dưới cùng */
		.footer-bottom {
		    max-width: 1200px;
		    margin: 50px auto 0 auto;
		    padding: 20px 40px 0 40px;
		    border-top: 1px solid #1e293b;
		    text-align: center;
		    font-size: 13px;
		    color: #64748b;
		}
		
		/* Tối ưu hóa hiển thị trên màn hình Tablet và Mobile (Responsive) */
		@media (max-width: 992px) {
		    .footer-container {
grid-template-columns: 1fr 1fr; /* Chuyển thành 2 hàng, mỗi hàng 2 cột */
		        gap: 30px;
		    }
		}
		
		@media (max-width: 576px) {
		    .footer-container {
		        grid-template-columns: 1fr; /* Điện thoại nhỏ hiển thị 1 cột đứng dọc */
		        padding: 0 20px;
		    }
		    .newsletter-form {
		        flex-direction: column; /* Ô nhập và nút bấm xếp dọc trên mobile */
		    }
		}

        /* RESPONSIVE */
        @media(max-width: 1024px){

            .games{
                grid-template-columns: repeat(2, 1fr);
            }

            .trending{
                grid-template-columns: repeat(2, 1fr);
            }

            .categories{
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 768px){

            header{
                flex-direction: column;
                gap: 20px;
                padding: 20px;
        }
        }

    </style>
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
</head>

<body>

    <!-- HEADER -->
    <div th:replace="fragments/header-user :: header-user"></div>

    <!-- MAIN CONTENT -->
    <main>

        <div class="page-header">
            <h1>Game yêu thích ❤️</h1>
            <p class="wishlist-count">Bạn có 18 game trong danh sách yêu thích</p>
        </div>

        <!-- FILTER & SORT -->
        <div class="controls">
            <div>
                <strong>Sắp xếp & Lọc</strong>
            </div>
            <div class="sort-section">
                <select id="sortSelect" class="sort-select">
                  <option value="newest">Ngày thêm gần nhất</option>
                  <option value="oldest">Ngày thêm cũ nhất</option>
				  <option value="priceAsc">Giá thấp đến cao</option>
				  <option value="priceDesc">Giá cao đến thấp</option>
				  <option value="rating">Đánh giá cao nhất</option>
				</select>

              <select id="filterSelect" class="filter-select">
                 <option value="all">Tất cả thể loại</option>
                 <option value="Action">Action</option>
                 <option value="RPG">RPG</option>
                 <option value="Adventure">Adventure</option>
                 <option value="Strategy">Strategy</option>
              </select>
            </div>
        </div>

        <!-- WISHLIST ITEMS -->
        <div class="wishlist-container">

            <div class="wishlist-item"  
                        data-category="Action"
					    data-price="499000"
					    data-rating="4.1"
					    data-date="2025-08-20" th:each = "item : ${wishlistList}">
                <div class="item-image">
				<img  th:src="@{/images/{file}(file=${item.game.thumbnail})}">
                    <div class="wishlist-badge">♥ YÊU THÍCH</div>
                </div>
                <div class="item-info">
                    <div class="item-title" th:text = "${item.game.gameName}">Dragon's Dogma</div>
					<div class = "item-rating">
					    <span th:each="i : ${#numbers.sequence(1,5)}">
					        <span th:if="${i <= item.game.rating}">★</span>
					        <span th:if="${i > item.game.rating}">☆</span>
					    </span>
					</div>
                    <div class="item-category">Action | Sci-Fi</div>
                    <div class="item-date" th:text="${'Ngày thêm :'+item.added_at}">Ngày thêm: 20/08/2025</div>
                    <div class="item-price" th:text = "${item.game.price}">499.000đ</div>
                    <div class="item-actions">
						<!-- Đã mua -->
						<button class="action-btn cart-btn"
						        th:if="${username != null && gamePaidId.contains(item.game.game_id)}">
						    <a th:href="@{/games/{file}(file=${item.game.filegame})}">Tải về</a>
						</button>

						<!-- Đã thêm vào giỏ -->
						<button class="action-btn cart-btn"
						        th:if="${username != null
						               && !gamePaidId.contains(item.game.game_id)
						               && listgame.contains(item.game.game_id)}">
						    Đã thêm vào giỏ
						</button>
						<form th:if="${item.game.status=='Active'
						             && (username == null
						                 || (!gamePaidId.contains(item.game.game_id)
						                     && !listgame.contains(item.game.game_id)))}"
						      th:action="@{/user/addcart/{id}(id=${item.game.game_id})}"
						      method="post">

						    <button class="action-btn cart-btn" type="submit">
						        Thêm vào giỏ hàng
						    </button>
						</form>
                        <button class="action-btn remove-btn"><a th:href="@{/user/wishlist/delete/{file}(file=${item.game.filegame})}">Xóa</a></button>
                    </div>
                </div>
            </div>
                
        </div>

        <!-- PAGINATION -->
        <div class="pagination" id="pagination"></div>
    </main>

    <!-- FOOTER -->
        <div th:replace="~{fragments/footer :: footer}"></div>


	
    
<script>
const container = document.querySelector(".wishlist-container");
const sort = document.getElementById("sortSelect");
const filter = document.getElementById("filterSelect");
const pagination = document.getElementById("pagination");

const itemsPerPage = 9;
let currentPage = 1;

// Lưu toàn bộ game
const allItems = [...document.querySelectorAll(".wishlist-item")];

// Số trang luôn theo tổng số game ban đầu
const totalPages = Math.ceil(allItems.length / itemsPerPage);

function render(page = currentPage) {

    currentPage = page;

    let items = [...allItems];

    // BỘ LỌC THỂ LOẠI
    if (filter.value !== "all") {
        items = items.filter(item =>
            item.dataset.category.includes(filter.value)
        );
    }

   
    // BỘ SẮP XẾP (Ngày - Giá - Đánh giá)
    items.sort((a, b) => {
        switch (sort.value) {
            case "newest":
                return new Date(b.dataset.date) - new Date(a.dataset.date);
            case "oldest":
                return new Date(a.dataset.date) - new Date(b.dataset.date);
            case "priceAsc":
                return Number(a.dataset.price) - Number(b.dataset.price);
            case "priceDesc":
                return Number(b.dataset.price) - Number(a.dataset.price);
            case "rating":
                return Number(b.dataset.rating) - Number(a.dataset.rating);
            default:
                return 0;
        }
    });
// HIỂN THỊ GAME
    allItems.forEach(item => item.style.display = "none");
    container.innerHTML = "";
    items.forEach(item => container.appendChild(item));

   
    // PHÂN TRANG    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;

    items.slice(start, end).forEach(item => {
        item.style.display = "block";
    });

    createPagination();

    // TỰ CUỘN LÊN ĐẦU DANH SÁCH GAME
    window.scrollTo({
        top: 0,
        behavior: "auto"
    });

}

function createPagination() {
    pagination.innerHTML = "";

   
    // NÚT TRANG TRƯỚC (<)
    const prev = document.createElement("button");
    prev.innerHTML = "&lt;";
    prev.disabled = currentPage === 1;
    prev.onclick = () => {
        render(currentPage - 1);
    };
    pagination.appendChild(prev);

  
    // CÁC NÚT SỐ TRANG
    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.innerText = i;
        if (i === currentPage) {
            btn.classList.add("active");
        }
        btn.onclick = () => {
            render(i);
        };
        pagination.appendChild(btn);
    }

    
    // NÚT TRANG SAU (>)
    const next = document.createElement("button");
    next.innerHTML = "&gt;";
    next.disabled = currentPage === totalPages;

    next.onclick = () => {
        render(currentPage + 1);
    };

    pagination.appendChild(next);
}

// SỰ KIỆN BỘ LỌC
sort.addEventListener("change", () => render(1));
filter.addEventListener("change", () => render(1));

// KHỞI TẠO
render(1);

// Thêm vào giỏ hàng
document.querySelectorAll(".cart-btn").forEach(button => {

    button.addEventListener("click", function () {

        const game = this.closest(".wishlist-item");

        const item = {
            title: game.querySelector(".item-title").innerText,
            price: game.querySelector(".item-price").innerText,
            category: game.querySelector(".item-category").innerText,
            rating: game.querySelector(".item-rating").innerText,
            image: game.querySelector("img").src
        };

        // Lấy giỏ hàng hiện có
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        // Thêm game vào giỏ
        cart.push(item);

        // Lưu lại
        localStorage.setItem("cart", JSON.stringify(cart));
        alert("Đã thêm game vào giỏ hàng!");

        // Nếu muốn chuyển sang trang giỏ hàng ngay thì bỏ comment dòng dưới
        window.location.href = "/user/cart.html";
    });
});

// Xóa game khỏi Wishlist
document.querySelectorAll(".remove-btn").forEach(button=>{
    button.addEventListener("click",function(){
        const game=this.closest(".wishlist-item");
        const gameName=game.querySelector(".item-title").innerText;

        if(confirm("Bạn có chắc muốn xóa '" + gameName + "' khỏi danh sách yêu thích?")){
            game.remove();
alert("Đã xóa thành công!");
        }
    });
});
</script>
</body>
</html>
