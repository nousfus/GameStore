<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Sản phẩm - GameStore</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #0f172a;
            color: white;
        }

        /* HEADER */
        header{
            background-color: #111827;
            padding: 20px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo{
            color: #22d3ee;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a{
            text-decoration: none;
            color: #d1d5db;
            margin: 0 15px;
            transition: 0.3s;
        }

        nav a:hover{
            color: white;
        }

        .header-right{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box{
            padding: 10px 15px;
            width: 250px;
            border: none;
            outline: none;
            border-radius: 10px;
            background-color: #1f2937;
            color: white;
        }

        .user-menu{
            background-color: #22d3ee;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-menu:hover{
            background-color: #67e8f9;
        }

        /* MAIN CONTENT */
        main{
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            padding: 30px 80px;
            min-height: calc(100vh - 150px);
        }

        /* SIDEBAR - FILTER */
        .sidebar{
            background-color: #111827;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #374151;
            height: fit-content;
        }

        .sidebar h3{
            color: #22d3ee;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .filter-group{
            margin-bottom: 20px;
            border-bottom: 1px solid #374151;
            padding-bottom: 15px;
        }

        .filter-group label{
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-group label:hover{
            color: #22d3ee;
        }

        .filter-group input[type="checkbox"]{
            margin-right: 10px;
            cursor: pointer;
        }

        .filter-group input[type="range"]{
            width: 100%;
            margin-top: 10px;
        }

        /* PRODUCTS SECTION */
        .products-section{
            display: flex;
            flex-direction: column;
        }

        .products-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .products-header h2{
            font-size: 28px;
        }

        .sort-options{
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 8px 15px;
            color: white;
            cursor: pointer;
        }

        /* GAME CARDS */
        .games{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .game-card{
            background-color: #111827;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid #374151;
        }

        .game-card:hover{
            transform: translateY(-8px);
            border-color: #22d3ee;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
        }

        .game-card img{
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .game-info{
            padding: 20px;
        }

        .game-title{
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .game-rating{
            font-size: 14px;
            color: #fbbf24;
            margin-bottom: 10px;
        }

        .game-category{
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .price-row{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .price{
            color: #22d3ee;
            font-size: 20px;
            font-weight: bold;
        }

        .action-buttons{
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .cart-btn, .wishlist-btn{
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .cart-btn{
            background-color: #22d3ee;
            color: black;
        }

        .cart-btn:hover{
            background-color: #67e8f9;
        }

        .wishlist-btn{
            background-color: #374151;
            color: white;
        }

        .wishlist-btn:hover{
            background-color: #4b5563;
        }

        /* PAGINATION */
        .pagination{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #374151;
        }

        .pagination a{
            padding: 10px 15px;
            background-color: #1f2937;
            color: white;
            border: 1px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
			align-content : center;
        }
		.pagination button{
            padding: 10px 15px;
            background-color: #1f2937;
            color: white;
            border: 3px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pagination button:hover, .pagination button.active, .pagination a:hover{
            background-color: #22d3ee;
            color: black;
            border-color: #22d3ee;
        }

        /* FOOTER */
        footer{
            background-color: #111827;
            padding: 30px;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid #374151;
            margin-top: 40px;
        }

        /* RESPONSIVE */
        @media(max-width: 1024px){
            main{
                padding: 20px 40px;
            }

            .games{
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 768px){
            header{
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            main{
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .sidebar{
                display: none;
            }

            .games{
                grid-template-columns: 1fr;
            }
        }
		a{
			text-decoration : none;
		}
		.user-menu{
            background-color: #22d3ee;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-menu:hover{
            background-color: #67e8f9;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <a href="/" class="logo">GameStore</a>

        <nav>
            <a href="/">Store</a>
            <a href="/user/product-list">Library</a>
            <a href="#">Community</a>
            <a href="#">News</a>
        </nav>

        <div class="header-right">
            <input type="text" placeholder="Tìm kiếm game..." class="search-box">
            <button class="user-menu">Tài khoản</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- SIDEBAR - FILTER -->
        <aside class="sidebar">
			<form action="/user/product-list/filter" method="get">
            <div class="filter-group">
				<button type="submit" class="user-menu">Lọc</button><br/><br/>
                <h3>Thể loại</h3>
                <label th:each = "item :${dscate}">
					<input type="checkbox" th:text = "${item.category_name}" name = "categories" th:value = "${item.category_id}"> 
				</label>

            </div>

            <div class="filter-group">
                <h4>Giá</h4>
                <label>Từ: <strong>0đ</strong> - Tới: <strong>1.000.000đ</strong></label>
                <input type="range" min="0" max="1000000" value="1000000" name = "price">
            </div>

            <div class="filter-group">
                <h4>RAM</h4>
                <select style="width: 100%; padding: 8px; border-radius: 5px; background-color: #0f172a; color: white; border: 1px solid #374151;">
                    <option value="">Chọn RAM</option>
                    <option value="4gb">4GB</option>
                    <option value="8gb">8GB</option>
                    <option value="12gb">12GB</option>
                    <option value="16gb">16GB</option>
                    <option value="24gb">24GB</option>
                    <option value="32gb">32GB</option>
                    <option value="48gb">48GB</option>
                    <option value="64gb">64GB</option>
                </select>
            </div>

            <div class="filter-group">
                <h4>Dung lượng lưu trữ</h4>
                <select style="width: 100%; padding: 8px; border-radius: 5px; background-color: #0f172a; color: white; border: 1px solid #374151;">
                    <option value="">Chọn Storage</option>
                    <option value="128gb">128GB</option>
                    <option value="256gb">256GB</option>
                    <option value="512gb">512GB</option>
                    <option value="1tb">1TB</option>
                    <option value="2tb">2TB</option>
                    <option value="4tb">4TB</option>
                </select>
            </div>

            <div class="filter-group">
                <h3>Đánh giá</h3>
				<select id="rating" name="rating">
                    <option value="">Chọn số sao</option>
                    <option value="5">5 - Xuất sắc</option>
                    <option value="4">4 - Rất tốt</option>
                    <option value="3">3 - Tốt</option>
                    <option value="2">2 - Trung bình</option>
                    <option value="1">1 - Kém</option>
                </select>
            </div>

            <div class="filter-group">
                <h3>Trạng thái</h3>
                <label><input type="checkbox"> Mới nhất</label>
                <label><input type="checkbox"> Giảm giá</label>
                <label><input type="checkbox"> Best seller</label>
            </div>
			</form>
        </aside>

        <!-- PRODUCTS -->
        <section class="products-section">

            <div class="products-header">
                <h2>Danh sách Sản phẩm</h2>
				<select class="user-menu" name="addcart">
					<option value = "">Chọn giỏ hàng</option>
		            <option th:each="item,stat : ${carts}"
		                    th:value="${item.cart_id}"
		                    th:text="'Giỏ hàng '+${stat.index+1}">
		            </option>
		        </select>
                <select class="sort-options">
                    <option>Sắp xếp theo</option>
                    <option>Mới nhất</option>
                    <option>Giá thấp đến cao</option>
                    <option>Giá cao đến thấp</option>
                    <option>Đánh giá cao nhất</option>
                </select>
            </div>

			<div class="games">

			    <div class="game-card"
			         th:each="game : ${gamePage.content}">

			        <a th:href="@{/user/product-detail/{id}(id=${game.game_id})}">
			            <img th:src="@{/uploads/images/{file}(file=${game.thumbnail})}">

			            <div class="game-info">
			                <div class="game-title"
			                     th:text="${game.game_name}">
			                </div>

			                <div class="game-rating">★★★★★ (4.8)</div>

			                <div class="game-category" th:text = "${game.categories}">
			                    Action | Sci-Fi
			                </div>

			                <div class="price-row">
			                    <div class="price"
			                         th:text="${game.price}">
			                    </div>
			                </div>

			                <div class="action-buttons">
			                    <button class="cart-btn" th:if = "${game.status=='Active'}">Thêm giỏ hàng</button>
								<button class="cart-btn" th:if = "${game.status=='Unactive'}">Sắp ra mắt</button>
			                    <button class="wishlist-btn">❤</button>
			                </div>
			            </div>
			        </a>

			    </div>

			</div>
            <!-- PAGINATION -->
            <div class="pagination">
                <a th:if="${!gamePage.first}" th:href="@{/user/product-list(page=${currentPage-1})}"><button>&lt;</button></a>
                <a th:each="i : ${#numbers.sequence(0, gamePage.totalPages-1)}" th:href="@{/user/product-list(page=${i})}" th:text="${i+1}"><button class="active">1</button></a>
                <a th:if="${!gamePage.first}" th:href="@{/user/product-list(page=${currentPage+1})}"><button>&gt;</button></a>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 GameStore. All Rights Reserved.</p>
    </footer>

</body>
</html>
