<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử Mua hàng - GameStore</title>

    <style>
		a{
			text-decoration : none;
		}
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #0f172a;
            color: white;
        }

        /* HEADER */
        header{
            background-color: #111827;
            padding: 20px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo{
            color: #22d3ee;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a{
            text-decoration: none;
            color: #d1d5db;
            margin: 0 15px;
            transition: 0.3s;
        }

        nav a:hover{
            color: white;
        }

        .header-right{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-menu{
            background-color: #22d3ee;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-menu:hover{
            background-color: #67e8f9;
        }

        /* MAIN CONTENT */
        main{
            padding: 40px 80px;
            min-height: calc(100vh - 150px);
        }

        .page-header{
            margin-bottom: 30px;
        }

        .page-header h1{
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* TABS */
        .tabs{
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #374151;
            padding-bottom: 0;
        }

        .tab{
            padding: 15px 25px;
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover{
            color: #22d3ee;
        }

        .tab.active{
            color: #22d3ee;
            border-bottom-color: #22d3ee;
        }

        /* FILTER & SEARCH */
        .controls{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #111827;
            border-radius: 10px;
            border: 1px solid #374151;
        }

        .search-input{
            padding: 10px 15px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            width: 300px;
        }

        .filter-select{
            padding: 10px 15px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        /* ORDER LIST */
        .orders-container{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card{
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 20px;
            transition: 0.3s;
        }

        .order-card:hover{
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
        }

        .order-header{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #374151;
        }

        .order-info{
            display: flex;
            flex-direction: column;
        }

        .order-info label{
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .order-info span{
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .order-status{
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge{
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-completed{
            background-color: #10b981;
            color: white;
        }

        .status-cancelled{
            background-color: #ef4444;
            color: white;
        }

        .status-pending{
            background-color: #f59e0b;
            color: black;
        }

        /* ORDER ITEMS */
        .order-items{
            margin-bottom: 15px;
        }

        .order-items h4{
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 10px;
        }

        .items-list{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .item-preview{
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background-color: #0f172a;
            border-radius: 8px;
            border-left: 3px solid #22d3ee;
        }

        .item-preview img{
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }

        .item-details{
            flex: 1;
        }

        .item-name{
            font-size: 13px;
            color: white;
            font-weight: bold;
        }

        .item-price{
            font-size: 12px;
            color: #22d3ee;
        }

        /* ORDER ACTIONS */
        .order-actions{
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .action-btn{
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-primary{
            background-color: #22d3ee;
            color: black;
        }

        .btn-primary:hover{
            background-color: #67e8f9;
        }

        .btn-secondary{
            background-color: #374151;
            color: white;
        }

        .btn-secondary:hover{
            background-color: #4b5563;
        }

        .btn-danger{
            background-color: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .btn-danger:hover{
            background-color: #ef4444;
            color: white;
        }

        /* EMPTY STATE */
        .empty-state{
            text-align: center;
            padding: 60px 20px;
            background-color: #111827;
            border-radius: 15px;
            border: 2px dashed #374151;
        }

        .empty-state-icon{
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-state h2{
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p{
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .back-btn{
            display: inline-block;
            background-color: #22d3ee;
            color: black;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover{
            background-color: #67e8f9;
        }

        /* PAGINATION */
        .pagination{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button{
            padding: 10px 15px;
            background-color: #1f2937;
            color: white;
            border: 1px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pagination button:hover, .pagination button.active{
            background-color: #22d3ee;
            color: black;
            border-color: #22d3ee;
        }

        /* FOOTER */
        footer{
            background-color: #111827;
            padding: 30px;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid #374151;
            margin-top: 40px;
        }

        /* RESPONSIVE */
        @media(max-width: 1024px){
            main{
                padding: 20px 40px;
            }

            .order-header{
                grid-template-columns: 1fr 1fr;
            }

            .controls{
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }

        /* SIDEBAR + LAYOUT (reused from profile) */
        .profile-container{display:grid;grid-template-columns:250px 1fr;gap:30px}
        .sidebar{background-color:#111827;padding:20px;border-radius:15px;border:1px solid #374151;height:fit-content;position:sticky;top:100px}
        .sidebar h3{color:#22d3ee;margin-bottom:20px;font-size:16px}
        .menu-item{padding:12px 15px;margin-bottom:8px;background:none;border:none;color:#d1d5db;text-align:left;cursor:pointer;border-radius:8px;transition:0.3s;width:100%;font-size:14px}
        .menu-item:hover, .menu-item.active{background-color:#1f2937;color:#22d3ee}
        .content-section{background-color:#111827;padding:30px;border-radius:15px;border:1px solid #374151}
        .section-title{font-size:24px;margin-bottom:25px;color:#22d3ee}

        @media(max-width: 768px){
            header{
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            main{
                padding: 20px;
            }

            .page-header h1{
                font-size: 24px;
            }

            .tabs{
                flex-wrap: wrap;
                gap: 5px;
            }

            .tab{
                padding: 10px 15px;
                font-size: 14px;
            }

            .order-header{
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .search-input{
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <a href="/" class="logo">GameStore</a>

        <nav>
            <a href="/">Store</a>
            <a href="/user/product-list">Library</a>
            <a href="#">Community</a>
            <a href="#">News</a>
        </nav>

        <div class="header-right">
            <button class="user-menu"><h3 th:text = "'Xin chào '+${username}"></h3></button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <div class="page-header">
            <h1>Lịch sử Mua hàng</h1>
        </div>

        <div class="profile-container">

            <!-- SIDEBAR -->
            <aside class="sidebar">
                <h3>Quản lý tài khoản</h3>
                <a href="/user/profile"><button class="menu-item">Thông tin cá nhân</button></a>
                <a href="/user/change-password"><button class="menu-item">Đổi mật khẩu</button></a>
                <a href="/user/history-purchase"><button class="menu-item active">Lịch sử mua hàng</button></a>
                <a href="/user/notifications"><button class="menu-item">Quản lý thông báo</button></a>
				<a href = "/user/wishlist" class="menu-item">Danh sách ưa thích</a>
            </aside>

            <!-- CONTENT -->
            <div class="content-section">

                <!-- TABS -->
				<div class="tabs">
				    <a class="tab" th:href="@{/history}">Tất cả</a>

				    <a class="tab"
				       th:href="@{/history(status='Pending')}">
				       Đang chờ xử lý
				    </a>

				    <a class="tab"
				       th:href="@{/history(status='Paid')}">
				       Đã mua
				    </a>

				    <a class="tab"
				       th:href="@{/history(status='Cancelled')}">
				       Đã hủy
				    </a>
					<a class="tab"
				       th:href="@{/history(status='Error')}">
				       Bị lỗi
				    </a>
				</div>

                <!-- FILTER & SEARCH -->
                <div class="controls">
                    <input type="text" placeholder="Tìm kiếm theo tên game hoặc mã đơn..." class="search-input">
                    <select class="filter-select">
                        <option>Tất cả thời gian</option>
                        <option>7 ngày qua</option>
                        <option>30 ngày qua</option>
                        <option>3 tháng qua</option>
                        <option>12 tháng qua</option>
                    </select>
                </div>

                <!-- ORDERS LIST -->
                <div class="orders-container">

            <div class="order-card" th:each = "item :${dsorder}">
                <div class="order-header">
                    <div class="order-info">
                        <label>Mã đơn</label>
                        <span th:text = "${item.order_id}">#ORD-2026-001235</span>
                    </div>
                    <div class="order-info">
                        <label>Ngày mua</label>
                        <span th:text = "${item.order_date}">09/06/2026</span>
                    </div>
                    <div class="order-info">
                        <label>Tổng tiền</label>
                        <span th:text = "${item.total_amount}+'đ'">1.298.000đ</span>
                    </div>
                    <div class="order-info order-status">
                        <span class="status-badge status-pending" th:if = "${item.status.equals('Pending')}">⏳ Đang chờ xử lý</span>
						<span class="status-badge status-completed" th:if = "${item.status.equals('Paid')}">✓ Đã mua</span>
						<span class="status-badge status-cancelled" th:if = "${item.status.equals('Cancelled')}">✗ Đã hủy</span>
						<span class="status-badge status-cancelled" th:if = "${item.status.equals('Error')}">✗ Error</span>
                    </div>
                </div>

                <div class="order-items">
                    <div class="items-list">
						<h4>Sản phẩm</h4>
                        <div class="item-preview" th:each = "itemsDetail :${orderdetaildao.findByOrderID(item.order_id)}">
                            <img  th:src="@{/images/{file}(file=${itemsDetail.game.thumbnail})}">
                            <div class="item-details">
                                <div class="item-name" th:text = "${itemsDetail.game.gameName}">Shadow Strike</div>
                                <div class="item-price" th:text = "${itemsDetail.price}">799.000đ</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="order-actions">
                    <button class="action-btn btn-primary">Xem chi tiết</button>
                    <button class="action-btn btn-secondary"  th:if = "${item.status.equals('Pending')}">Theo dõi đơn hàng</button>
                    <button class="action-btn btn-danger"  th:if = "${item.status.equals('Pending')}">Hủy đơn</button>
					<button class="action-btn btn-secondary" th:if = "${item.status.equals('Paid')}">Tải lại game</button>
					<button class="action-btn btn-secondary"  th:if = "${item.status.equals('Cancelled')}">Mua lại</button>
					<button class="action-btn btn-danger" th:if = "${item.status.equals('Error')}">Yêu cầu hỗ trợ</button>
                </div>
            </div>
        </div>

        <!-- PAGINATION -->
        <div class="pagination">
            <button>&lt;</button>
            <button class="active">1</button>
            <button>2</button>
            <button>&gt;</button>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 GameStore. All Rights Reserved.</p>
    </footer>

</body>
</html>
