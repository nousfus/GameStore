<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - GameStore</title>
    
    <!-- CSS CHUNG CỦA WEB -->
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">

    <!-- CSS DÀNH RIÊNG CHO TRANG PROFILE -->
    <style>
        .profile-wrapper {
            display: flex;
            gap: 30px;
            padding: 40px 80px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 150px);
            color: #e2e8f0;
        }

        /* ----- SIDEBAR MENU ----- */
        .profile-sidebar {
            width: 280px;
            background-color: #111827;
            border-radius: 12px;
            padding: 25px 20px;
            border: 1px solid #374151;
            height: fit-content;
        }
        
        .profile-sidebar h2 {
            font-size: 22px;
            color: white;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #374151;
        }
        
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar-menu li { margin-bottom: 10px; }
        
        .sidebar-menu a {
            display: block;
            padding: 12px 15px;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .sidebar-menu a:hover {
            background-color: rgba(34, 211, 238, 0.1);
            color: #22d3ee;
            padding-left: 20px;
        }
        
        .sidebar-menu a.active {
            background-color: rgba(34, 211, 238, 0.15);
            color: #22d3ee;
            border-left: 4px solid #22d3ee;
        }

        /* ----- MAIN CONTENT ----- */
        .profile-content {
            flex: 1;
            background-color: #111827;
            border-radius: 12px;
            padding: 40px;
            border: 1px solid #374151;
        }

        .profile-header {
            margin-bottom: 30px;
        }
        
        .profile-header h1 {
            font-size: 28px;
            color: white;
            margin-bottom: 5px;
        }
        
        .profile-header p {
            color: #9ca3af;
            font-size: 15px;
        }

        /* FORM ĐỔI VAI TRÒ */
        .role-switch-form {
            background: #1f2937;
            padding: 15px 20px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            border: 1px solid #374151;
        }

        .role-switch-form select {
            background: #111827;
            color: #22d3ee;
            border: 1px solid #374151;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        .role-switch-form button {
            background: #22d3ee;
            color: black;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .role-switch-form button:hover { background: #67e8f9; }

        /* KHU VỰC AVATAR */
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #374151;
        }

        .avatar-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
            background-color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-info h3 { font-size: 20px; color: white; margin-bottom: 5px;}
        .avatar-info p { color: #9ca3af; font-size: 14px; margin-bottom: 10px;}
        
        /* FORM THÔNG TIN (DÀN 2 CỘT) */
        .profile-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #d1d5db;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input[type="text"],
        .form-group input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            background-color: #1f2937;
            border: 1px solid #4b5563;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus {
            border-color: #22d3ee;
            outline: none;
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
        }

        .form-group input[readonly] {
            background-color: #374151;
            color: #9ca3af;
            cursor: not-allowed;
            border-color: transparent;
        }

        .file-upload-wrapper input[type="file"] {
            color: #9ca3af;
            font-size: 14px;
        }
        
        .file-upload-wrapper input[type="file"]::file-selector-button {
            padding: 8px 15px;
            border-radius: 6px;
            background: #374151;
            border: 1px solid #4b5563;
            color: white;
            cursor: pointer;
            margin-right: 15px;
            transition: 0.3s;
        }
        
        .file-upload-wrapper input[type="file"]::file-selector-button:hover {
            background: #4b5563;
        }

        /* NÚT LƯU & XÓA */
        .form-actions {
            grid-column: span 2;
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding-top: 25px;
            border-top: 1px solid #374151;
        }

        .btn-save {
            background-color: #22d3ee;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save:hover { background-color: #67e8f9; transform: translateY(-2px); }

        .btn-delete {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-delete:hover { background-color: #ef4444; color: white; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .profile-wrapper { flex-direction: column; padding: 30px 20px; }
            .profile-sidebar { width: 100%; }
            .profile-form { grid-template-columns: 1fr; }
            .form-actions { grid-column: span 1; flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- GỌI HEADER CHUNG -->
    <div th:replace="~{fragments/header-user :: header-user}"></div>

    <div class="profile-wrapper">
        
        <!-- CỘT TRÁI: SIDEBAR MENU -->
        <aside class="profile-sidebar">
            <h2>Thông tin Cá nhân</h2>
            <ul class="sidebar-menu">
                <li><a href="/user/profile" class="active">Hồ sơ cá nhân</a></li>
                <li><a href="/user/change-password">Đổi mật khẩu</a></li>
                <li><a href="/user/history">Lịch sử mua hàng</a></li>
                <li><a href="/user/notifications">Quản lý thông báo</a></li>
                <li><a href="/user/wishlist">Danh sách ưa thích</a></li>
            </ul>
        </aside>

        <!-- CỘT PHẢI: NỘI DUNG FORM -->
        <section class="profile-content">
            
            <div class="profile-header">
                <h1>Hồ sơ Cá nhân</h1>
                <p>Cập nhật thông tin để trải nghiệm GameStore tốt hơn.</p>
            </div>

            <!-- NẾU CÓ NHIỀU VAI TRÒ THÌ HIỆN FORM ĐỔI VAI TRÒ -->
            <form class="role-switch-form" th:if="${dsrole != null && dsrole.size() > 1}" th:action="@{/user/role}" method="post">
                <span style="font-size: 14px; color: #9ca3af;">Đang đăng nhập dưới quyền:</span>
                <select name="role">
                    <option th:each="r : ${dsrole}" 
				        th:value="${r.roleId}" 
				        th:text="${r.roleName}"  
				        th:selected="${r.roleName == rolepicked}">
				    </option>
                </select>
                <button type="submit">Chuyển đổi ⇄</button>
            </form>

            <!-- FORM CẬP NHẬT THÔNG TIN CÁ NHÂN -->
<form th:action="@{/user/profile}" method="post" enctype="multipart/form-data">
                
                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <!-- Đã đổi userEdit thành user và dùng #strings.isEmpty cực kỳ an toàn -->
                        <img th:if="${!#strings.isEmpty(user.avatar)}" 
                             th:src="@{/images/{file}(file=${user.avatar})}" alt="Avatar">
                        <span th:if="${#strings.isEmpty(user.avatar)}" 
                              style="color: #9ca3af; font-size: 30px;">👤</span>
                    </div>
                    <div class="avatar-info file-upload-wrapper">
                        <h3 th:text="${user.fullname}">Tên người dùng</h3>
                        <p th:text="${user.email}">email@example.com</p>
                        <input type="file" name="avatar" accept="image/*">
                    </div>
                </div>

                <div class="profile-form">
                    <div class="form-group">
                        <label>Tên đăng nhập (Username)</label>
                        <!-- Đổi userEdit thành user -->
                        <input type="text" th:value="${user.username}" readonly>
                    </div>

                    <div class="form-group">
                        <label>Ngày tham gia</label>
                        <!-- Đổi userEdit thành user -->
                        <input type="text" th:value="${user.createdDate}" readonly>
                    </div>

                    <div class="form-group">
                        <label>Họ và Tên</label>
                        <!-- Đổi userEdit thành user -->
                        <input type="text" name="fullname" th:value="${user.fullname}" required placeholder="Nhập họ và tên của bạn">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <!-- Đổi userEdit thành user -->
                        <input type="email" name="email" th:value="${user.email}" required placeholder="Nhập địa chỉ email">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">Lưu thay đổi</button>
                        <button type="button" class="btn-delete" onclick="if(confirm('Bạn có chắc chắn muốn xóa tài khoản này không?')) window.location.href='/user/delete-account'">Xóa tài khoản</button>
                    </div>
                </div>
            </form>

        </section>
    </div>

    <!-- GỌI FOOTER CHUNG -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
