<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - GameStore</title>
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
</head>

<body>

    <!-- HEADER -->
<div th:replace="fragments/header-user :: header-user"></div>
    <!-- MAIN CONTENT -->
    <main class="login-register-page">
        <div class="auth-container">

            <!-- TABS -->
            <div class="tabs-header" style="display:flex; gap:10px; margin-bottom:20px;">
                <button id="tab-login" class="tab-btn active-tab" style="flex:1; padding:12px; border-radius:8px; border:none; background:#22d3ee; color:black; font-weight:bold;">Đăng Nhập</button>
                <button id="tab-register" class="tab-btn" style="flex:1; padding:12px; border-radius:8px; border:none; background:#1f2937; color:#d1d5db; font-weight:bold;">Đăng Ký</button>
            </div>

            <!-- PANEL: LOGIN -->
            <div id="panel-login" class="tab-panel" style="display:block;">
                <div class="auth-section login" style="padding:0;">
                    <h2>Đăng Nhập</h2>

                    <form method="POST" action="/user/login">
                        <div class="form-group">
                            <label for="login-email">Email hoặc Tên đăng nhập</label>
                            <input type="text" id="login-email" name="username" placeholder="Nhập email hoặc tên đăng nhập" required>
                        </div>

                        <div class="form-group">
                            <label for="login-password">Mật khẩu</label>
                            <input type="password" id="login-password" name="password" placeholder="Nhập mật khẩu" required>
                        </div>

                        <div class="form-group checkbox">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Ghi nhớ tôi</label>
                        </div>

                        <div class="forgot-password">
                            <a href="#">Quên mật khẩu?</a>
                        </div>

                        <button type="submit" class="submit-btn">Đăng Nhập</button>

                        <p class="switch-prompt" style="margin-top:12px; color:#9ca3af;">Chưa có tài khoản? <a href="#" id="link-to-register" style="color:#22d3ee; text-decoration:none;">Đăng ký</a></p>
                    </form>
                </div>
            </div>

            <!-- PANEL: REGISTER -->
            <div id="panel-register" class="tab-panel" style="display:none;">
                <div class="auth-section register" style="padding:0;">
                    <h2>Đăng Ký</h2>

                    <form method="POST" th:action="@{/user/register}">
                        <div class="form-group">
                            <label for="reg-fullname">Họ và Tên</label>
                            <input type="text" id="reg-fullname" name="fullName" placeholder="Nhập họ và tên" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" name="email" placeholder="Nhập email" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-username">Tên đăng nhập</label>
                            <input type="text" id="reg-username" name="username" placeholder="Nhập tên đăng nhập" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-password">Mật khẩu</label>
                            <input type="password" id="reg-password" name="password" placeholder="Nhập mật khẩu" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-confirm">Xác nhận mật khẩu</label>
                            <input type="password" id="reg-confirm" name="confirmPassword" placeholder="Xác nhận mật khẩu" required>
                        </div>

                        <div class="form-group checkbox">
                            <input type="checkbox" id="accept-terms" name="acceptTerms" required>
                            <label for="accept-terms">Tôi đồng ý với Điều khoản dịch vụ</label>
                        </div>

                        <!-- Developer checkbox -->
                        <div class="form-group checkbox">
                            <input type="checkbox" id="is-developer" name="isDeveloper">
                            <label for="is-developer">Developer</label>
                        </div>

                        <!-- Developer-specific fields (hidden by default) -->
                        <div id="developer-fields" class="dev-form">
                            <div class="form-group">
                                <label for="dev-studio">Tên Studio / Tổ chức</label>
                                <input type="text" id="dev-studio" name="devStudio" placeholder="Tên studio hoặc tổ chức">
                            </div>

                            <div class="form-group">
                                <label for="dev-bio">Giới thiệu ngắn</label>
                                <textarea id="dev-bio" name="devBio" rows="3" placeholder="Mô tả ngắn về bạn hoặc studio" style="width:100%; padding:10px; border-radius:8px; background:#0f172a; border:1px solid #374151; color:white;"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">Đăng Ký</button>

                        <p class="switch-prompt" style="margin-top:12px; color:#9ca3af;">Đã có tài khoản? <a href="#" id="link-to-login" style="color:#22d3ee; text-decoration:none;">Đăng nhập</a></p>
                    </form>
                </div>
            </div>

        </div>
    </main>
    
        <div th:replace="~{fragments/footer :: footer}"></div>
    

    <script>
        function showLogin(){
            document.getElementById('panel-login').style.display = 'block';
            document.getElementById('panel-register').style.display = 'none';
            var t = document.getElementById('tab-login');
            var r = document.getElementById('tab-register');
            t.classList.add('active-tab');
            t.style.background = '#22d3ee';
            t.style.color = 'black';
            r.classList.remove('active-tab');
            r.style.background = '#1f2937';
            r.style.color = '#d1d5db';
        }

        function showRegister(){
            document.getElementById('panel-login').style.display = 'none';
            document.getElementById('panel-register').style.display = 'block';
            var t = document.getElementById('tab-login');
            var r = document.getElementById('tab-register');
            r.classList.add('active-tab');
            r.style.background = '#22d3ee';
            r.style.color = 'black';
            t.classList.remove('active-tab');
            t.style.background = '#1f2937';
            t.style.color = '#d1d5db';
            // Update developer form visibility when showing register
            toggleDevForm();
        }

        document.getElementById('tab-login').addEventListener('click', showLogin);
        document.getElementById('tab-register').addEventListener('click', showRegister);

        var linkToRegister = document.getElementById('link-to-register');
        if(linkToRegister){
            linkToRegister.addEventListener('click', function(e){
                e.preventDefault();
                showRegister();
                document.getElementById('reg-fullname').focus();
            });
        }

        var linkToLogin = document.getElementById('link-to-login');
        if(linkToLogin){
            linkToLogin.addEventListener('click', function(e){
                e.preventDefault();
                showLogin();
                document.getElementById('login-email').focus();
            });
        }

        // Toggle developer-specific fields
        function toggleDevForm(){
            var cb = document.getElementById('is-developer');
            var f = document.getElementById('developer-fields');
            if(!f || !cb) return;
            f.style.display = cb.checked ? 'block' : 'none';
        }

        var devCb = document.getElementById('is-developer');
        if(devCb){
            devCb.addEventListener('change', toggleDevForm);
        }

        // Ensure correct state on page load
        toggleDevForm();
    </script>
