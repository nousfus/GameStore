<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thống kê Doanh thu - Admin</title>
        <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    
    <style>
      body {
        background: #0f172a;
        color: #fff;
      }

      header {
        background: #111827;
        padding: 16px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #374151;
      }

      .logo {
        color: #22d3ee;
        font-weight: bold;
      }

      .container {
        padding: 28px;
      }

      .card {
        background: #111827;
        padding: 18px;
        border-radius: 10px;
        border: 1px solid #374151;
        margin-bottom: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .metric {
        padding: 16px;
        border-radius: 8px;
        background: #0f172a;
        border: 1px solid #374151;
      }

      .chart {
        padding: 10px;
        margin-top: 18px;
        background: linear-gradient(180deg, #0f172a, #0b1220);
        border-radius: 12px;
        border: 1px solid #374151;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #e5e7eb;
        gap: 12px;
      }

      .chart-header span:first-child {
        font-size: 1rem;
        color: #9ca3af;
      }

      .chart-subtitle {
        display: block;
        color: #94a3b8;
        font-size: 0.9rem;
        margin-top: 6px;
      }

      .chart-header span:last-child {
        background: #1d4ed8;
        color: #fff;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
      }

      .date-range {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .date-range label {
        display: flex;
        flex-direction: column;
        font-size: 0.9rem;
        color: #cbd5e1;
        gap: 6px;
        min-width: 180px;
      }

      .date-range input {
        width: 100%;
        max-width: 220px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #fff;
      }

      .date-range button {
        background: #2563eb;
        border: none;
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .date-range button:hover {
        background: #1d4ed8;
      }

      .chart-svg {
        width: 1400px;
        height: 260px;
        display: block;
      }

      .chart-labels {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 12px;
        color: #9ca3af;
        font-size: 0.85rem;
        text-align: center;
        margin-top: 10px;
      }

      .chart-labels span {
        display: block;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
        border: 1px solid #1f2937;
      }

      .detail-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border-radius: 12px;
        background: #0f172a;
        border: 1px solid #374151;
      }

      .detail-table thead {
        background: #111827;
        color: #9ca3af;
      }

      .detail-table th,
      .detail-table td {
        padding: 14px 16px;
        border-bottom: 1px solid #1f2937;
        color: #e5e7eb;
      }

      .detail-table th {
        text-align: left;
        font-weight: 600;
      }

      .detail-table tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.03);
      }

      .detail-table tbody tr:hover {
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
</head>
<body>
<div th:replace="~{fragments/header-admin :: header-admin}"></div>
<main class="container">
  <h1 style="margin-bottom:12px">Thống kê Doanh thu</h1>
  <div class="card">
    <div class="grid">
      <div class="metric">Tổng doanh thu<br><strong style="color:#22d3ee;font-size:20px" th:text = "${TongDoanhThu}">12.345.000đ</strong></div>
      <div class="metric">Tổng đơn hàng<br><strong style="color:#22d3ee;font-size:20px" th:text = "${TongDonHang}">128</strong></div>
      <div class="metric">Đơn hàng hôm nay<br><strong style="color:#22d3ee;font-size:20px" th:text = "${DonHangHomNay}">42</strong></div>
    </div>
    <div class="chart">
     <div class="chart-header">
        <div>
          <span>Biểu đồ doanh thu</span>
          <span class="chart-subtitle" th:if="${startDate != null and endDate != null}"
                th:text="'Từ ' + ${#temporals.format(startDate, 'dd/MM/yyyy')} + ' đến ' + ${#temporals.format(endDate, 'dd/MM/yyyy')}">
          </span>
        </div>
      </div>
      
      <div class="date-range">
        <form method="get" action="/admin/revenue-report" style="display:flex; flex-wrap:wrap; align-items:flex-end; width:100%;">
          
          <label style="margin-right: 40px;">
            Ngày bắt đầu
            <input type="date" name="startDate" th:value="${startDate}" required />
          </label>
          
          <label style="margin-right: 50px;">
            Ngày kết thúc
            <input type="date" name="endDate" th:value="${endDate}" required />
          </label>
          
          <button type="submit">Xem doanh thu</button>
          
        </form>
      </div>     
      <div style="overflow-x:auto;">
        <!-- Đặt chiều rộng SVG tự động co giãn theo số lượng ngày -->
        <svg class="chart-svg" 
             th:attr="viewBox='0 0 ' + (${dates.size() * 40 + 100 > 1400 ? dates.size() * 40 + 100 : 1400}) + ' 260'"
             th:style="'width: ' + (${dates.size() * 40 + 100 > 1400 ? dates.size() * 40 + 100 : 1400}) + 'px;'"
             xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biểu đồ doanh thu">
          <defs>
            <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#2563eb" />
            </linearGradient>
          </defs>
          
          <!-- Các đường lưới ngang: Sửa thành x2="100%" để nó tự động kéo dài vô tận -->
          <g fill="none" stroke="#334155" stroke-width="1">
            <line x1="50" y1="220" x2="100%" y2="220"/>
            <line x1="50" y1="200" x2="100%" y2="200"/>
            <line x1="50" y1="180" x2="100%" y2="180"/>
            <line x1="50" y1="160" x2="100%" y2="160"/>
            <line x1="50" y1="140" x2="100%" y2="140"/>
            <line x1="50" y1="120" x2="100%" y2="120"/>
            <line x1="50" y1="100" x2="100%" y2="100"/>
            <line x1="50" y1="80" x2="100%" y2="80"/>
            <line x1="50" y1="60" x2="100%" y2="60"/>
            <line x1="50" y1="40" x2="100%" y2="40"/>
            <line x1="50" y1="20" x2="100%" y2="20"/>
          </g>

          <!-- Cột biểu đồ (Giữ nguyên của bạn) -->
		  <g fill="url(#barGradient)">
		      <th:block th:each="money, stat : ${revenues}">
		          <rect
		              th:x="${70 + stat.index * 40}"
		              th:with="
		                  h=${money * 200.0 / 2000000},
		                  y=${220 - h}"
		              th:y="${y}"
		              th:height="${h}"
		              width="24"
		              rx="2">
		              <title
		                  th:text="'Ngày: '
		                      + ${#temporals.format(dates[stat.index],'dd/MM/yyyy')}
		                      + '&#10;Doanh thu: '
		                      + ${#numbers.formatDecimal(money,0,'COMMA',0,'POINT')}
		                      + ' đ'">
		              </title>
		          </rect>
		      </th:block>
		  </g>
          
          <!-- Trục Y dọc -->
          <g stroke="#334155" stroke-width="1">
            <line x1="50" y1="220" x2="50" y2="20" />
          </g>
          
          <!-- Nhãn Trục Y -->
          <g fill="#94a3b8" font-size="12" text-anchor="end">
            <text x="44" y="224">0đ</text>
            <text x="44" y="204">200k</text>
            <text x="44" y="184">400k</text>
            <text x="44" y="164">600k</text>
            <text x="44" y="144">800k</text>
            <text x="44" y="124">1tr</text>
            <text x="44" y="104">1.2tr</text>
            <text x="44" y="84">1.4tr</text>
            <text x="44" y="64">1.6tr</text>
            <text x="44" y="44">1.8tr</text>
            <text x="44" y="24">2tr</text>
          </g>

          <!-- Nhãn Trục X (Ngày) -->
		  <g fill="#cbd5e1" font-size="12" text-anchor="middle">
		      <th:block th:each="d, stat:${dates}">
		          <text
		              th:x="${82+stat.index*40}"
		              y="250"
		              th:text="${#temporals.format(d,'dd/MM')}">
		          </text>
		      </th:block>
		  </g>
          
          <!-- VẠCH CHIA TRỤC X: Đã được chuyển thành vòng lặp Thymeleaf tự động -->
          <g stroke="#475569" stroke-width="1">
            <line x1="50" y1="220" x2="100%" y2="220" />
            <th:block th:each="d, stat : ${dates}">
                 <line th:x1="${82 + stat.index * 40}" y1="220" th:x2="${82 + stat.index * 40}" y2="226" />
            </th:block>
          </g>
        </svg>
      </div>
    </div>
   </div>
</main>
    <div th:replace="~{fragments/footer :: footer}"></div>
<script>
  const startDateInput = document.getElementById('startDate');
  const endDateInput = document.getElementById('endDate');
  const chartSubtitle = document.getElementById('chartSubtitle');
  const updateRange = document.getElementById('updateRange');

  function formatShortDate(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return `${date.getDate()}/${date.getMonth() + 1}`;
  }

  updateRange.addEventListener('click', () => {
    const start = startDateInput.value;
    const end = endDateInput.value;

    if (!start || !end) {
      alert('Vui lòng chọn ngày bắt đầu và ngày kết thúc.');
      return;
    }

    if (new Date(start) > new Date(end)) {
      alert('Ngày bắt đầu phải nhỏ hơn hoặc bằng ngày kết thúc.');
      return;
    }

    chartSubtitle.textContent = `Từ ${formatShortDate(start)} đến ${formatShortDate(end)}`;
  });
</script>
</body>
</html>
