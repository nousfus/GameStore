<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phản hồi Đánh giá - Developer</title>
  <style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#0f172a;color:#fff}header{background:#111827;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}.logo{color:#22d3ee;font-weight:bold}.container{padding:28px}.card{background:#111827;padding:18px;border-radius:10px;border:1px solid #374151;margin-bottom:16px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #374151;text-align:left}</style>
</head>
<body>
<header><div class="logo">GameStore Developer</div></header>
<main class="container">
  <h1 style="margin-bottom:12px">Phản hồi Đánh giá Game</h1>
  <div class="card">
    <p style="color:#9ca3af;margin-bottom:12px">Duyệt, trả lời hoặc báo cáo các đánh giá người dùng</p>
    <table>
      <thead><tr style="color:#9ca3af"><th>Game</th><th>Người dùng</th><th>Nội dung</th><th>Đánh giá</th><th>Phản hồi</th></tr></thead>
      <tbody>
        <tr>
          <td>Cyber Warriors</td>
          <td>Nguyễn Văn A</td>
          <td>Tuyệt vời, nhưng có lỗi ở level 3</td>
          <td>4</td>
          <td><button>Trả lời</button> <button>Báo cáo</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<footer style="background:#111827;padding:18px;text-align:center;color:#9ca3af;margin-top:30px">© 2026 GameStore</footer>
</body>
</html>
