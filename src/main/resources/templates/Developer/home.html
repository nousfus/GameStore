<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameStore - Developer</title>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
        body{background-color:#0f172a;color:white}
        header{background-color:#111827;padding:20px 80px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #374151}
        .logo{color:#60a5fa;font-size:28px;font-weight:bold}
        nav a{color:#d1d5db;text-decoration:none;margin:0 12px}
        .header-right{display:flex;gap:10px;align-items:center}
        .hero{height:260px;background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1400&auto=format&fit=crop');background-size:cover;background-position:center;display:flex;align-items:center;padding:0 80px}
        .hero h1{font-size:36px}
        .container{padding:40px 80px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:20px}
        .card{background:#0b1220;padding:18px;border-radius:12px;border:1px solid #374151}
        .card h3{margin-bottom:8px}
        .muted{color:#9ca3af}
        a.card-link{color:inherit;text-decoration:none}
        footer{background-color:#111827;padding:30px;text-align:center;color:#9ca3af;margin-top:40px}
        @media(max-width:768px){header{padding:16px} .hero{height:200px;padding:16px} .container{padding:20px}}
		.login-btn{
		            background-color: #22d3ee;
		            color: black;
		            border: none;
		            padding: 10px 20px;
		            border-radius: 10px;
		            font-weight: bold;
		            cursor: pointer;
		        }

		        .login-btn:hover{
		            background-color: #67e8f9;
		        }
    </style>

</head>

<div th:replace="fragments/header-dev :: header-dev"></div>

<div class="hero" xmlns:th="http://www.thymeleaf.org">
    <div>
        <h1>Chào mừng, Developer</h1>
        <p class="muted" style="margin-top:8px">Quản lý game, phiên bản, doanh thu và phản hồi người chơi.</p>
    </div>
</div>

<main class="container">
    <section class="section-overview">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>Xem nhanh</h2>
            <a href="/developer/game-management" style="color:#22d3ee;text-decoration:none">Quản lý game</a>
        </div>

        <div class="grid">
            <a class="card-link" href="/developer/game-management"><div class="card"><h3>Quản lý Game</h3><p class="muted">Thêm, chỉnh sửa phiên bản và thông tin game</p></div></a>
            <a class="card-link" href="/developer/revenue-tracking"><div class="card"><h3>Theo dõi Doanh thu</h3><p class="muted">Xem thống kê doanh thu cho game của bạn</p></div></a>
            <a class="card-link" href="/developer/review-feedback"><div class="card"><h3>Phản hồi & Đánh giá</h3><p class="muted">Trả lời phản hồi và quản lý review</p></div></a>
        </div>
    </section>

</main>
    <div th:replace="~{fragments/footer :: footer}"></div>

</html>
