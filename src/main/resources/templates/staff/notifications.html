<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gửi Thông báo - Nhân viên</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #111827;
            padding: 18px 40px;
            border-bottom: 1px solid #1e293b;
        }
        .logo a {
            color: #22d3ee;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.1rem;
            transition: opacity 0.2s;
        }
        .logo a:hover {
            opacity: 0.8;
        }
        main {
            padding: 40px 30px;
            flex: 1;
            max-width: 1000px; /* Tăng nhẹ độ rộng để bảng hiển thị đẹp hơn */
            width: 100%;
            margin: 0 auto;
        }
        h1, h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #f8fafc;
        }
        h2 {
            font-size: 1.4rem;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .card {
            background: #111827;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #22d3ee;
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
        }
        button {
            background: #22d3ee;
            color: #0f172a;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #06b6d4;
            transform: translateY(-1px);
        }
        .alert {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            transition: opacity 0.5s ease;
        }
        .alert-success {
            background: rgba(6, 95, 70, 0.3);
            color: #34d399;
            border: 1px solid #065f46;
        }
        .alert-error {
            background: rgba(153, 27, 27, 0.3);
            color: #f87171;
            border: 1px solid #991b1b;
        }

        /* --- CSS CHO BẢNG DỮ LIỆU --- */
        .table-responsive {
            overflow-x: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
        }
        th {
            background: #1f2937;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }
        tbody tr:hover {
            background: #1e293b;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-unread {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid #d97706;
        }
        .badge-read {
            background: rgba(75, 85, 99, 0.3);
            color: #9ca3af;
            border: 1px solid #4b5563;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="/staff/home">GameStore Staff</a>
    </div>
</header>

<main>
    <h1>Gửi Thông báo</h1>
    
    <form id="notificationForm" action="/staff/notification/send" method="POST" class="card">
        <p style="color:#94a3b8; margin-bottom: 16px; font-size: 0.9rem;">Soạn và gửi thông báo trực tiếp tới người dùng hệ thống.</p>
        
        <div th:if="${message}" id="statusAlert" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" id="statusAlert" class="alert alert-error" th:text="${error}"></div>
        
        <div>
            <label>Người nhận</label>
            <input type="text" name="username" placeholder="Nhập chính xác tên tài khoản (username)" required>
        </div>
        
        <div>
            <label>Tiêu đề</label>
            <input type="text" name="title" placeholder="Nhập tiêu đề ngắn gọn của thông báo" required>
        </div>
        
        <div>
            <label>Nội dung chi tiết</label>
            <textarea name="content" placeholder="Nội dung chi tiết gửi tới người dùng..." rows="5" required></textarea>
        </div>
        
        <div style="text-align: right; margin-top: 20px;">
            <button type="submit" id="btnSubmit">Gửi thông báo</button>
        </div>
    </form>

    <div class="card" style="margin-top: 35px;">
        <h2>Lịch sử thông báo đã gửi</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%">Người nhận</th>
                        <th style="width: 25%">Tiêu đề</th>
                        <th style="width: 35%">Nội dung</th>
                        <th style="width: 15%">Thời gian</th>
                        <th style="width: 10%">Trạng thái</th>
                    </tr>
                </thead>
                <tbody>
    <tr th:each="noti : ${allNotifications}">
        <td th:text="${noti.username}" style="font-weight: bold; color: #22d3ee;"></td>
        <td th:text="${noti.title}"></td>
        <td th:text="${noti.content}" style="color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;"></td>
        <td th:text="${#dates.format(noti.created_at, 'dd/MM/yyyy HH:mm')}"></td>
        <td>
            <span th:if="${!noti.is_read}" class="badge badge-unread">Chưa đọc</span>
            <span th:if="${noti.is_read}" class="badge badge-read">Đã đọc</span>
        </td>
    </tr>
    
    <tr th:if="${#lists.isEmpty(allNotifications)}" th:each="i : ${#numbers.sequence(1, 3)}">
        <td style="color: #475569;">&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
</tbody>
            </table>
        </div>
    </div>
</main>

<footer style="background:#111827; padding:24px; text-align:center; color:#64748b; border-top: 1px solid #1e293b; font-size: 0.9rem; margin-top: 40px;">
    © 2026 GameStore
</footer>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const alertBox = document.getElementById("statusAlert");
        if (alertBox) {
            setTimeout(() => {
                alertBox.style.opacity = "0";
                setTimeout(() => alertBox.remove(), 500);
            }, 4000);
        }

        const form = document.getElementById("notificationForm");
        const btnSubmit = document.getElementById("btnSubmit");

        form.addEventListener("submit", function() {
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Đang xử lý gửi...";
        });
    });
</script>
</body>
</html>
