<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý Đơn hàng - Nhân viên</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body {
      background: linear-gradient(135deg, #020617, #0f172a 45%, #111827);
      color: #f8fafc;
      min-height: 100vh;
    }
    header {
      background: rgba(17, 24, 39, 0.95);
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
      backdrop-filter: blur(8px);
    }
    .logo { color: #22d3ee; font-weight: 700; font-size: 1.15rem; }
    .container { padding: 28px; max-width: 1400px; margin: 0 auto; }
    .page-title { font-size: 1.8rem; margin-bottom: 8px; }
    .page-subtitle { color: #94a3b8; margin-bottom: 20px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .summary-card {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(2, 6, 23, 0.25);
    }
    .summary-card .label { color: #94a3b8; font-size: 0.95rem; margin-bottom: 8px; }
    .summary-card .value { font-size: 1.3rem; font-weight: 700; color: #22d3ee; }
    .panel {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.3);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .date-filter {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .date-filter label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #cbd5e1;
      font-size: 0.9rem;
    }
    .date-filter input {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      min-width: 160px;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn.secondary { background: #475569; }
    .btn.secondary:hover { background: #334155; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #374151; vertical-align: middle; }
    thead { color: #9ca3af; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid transparent;
    }
    .status-pending { background: rgba(250, 204, 21, 0.16); color: #fde68a; border-color: rgba(250, 204, 21, 0.25); }
    .status-complete { background: rgba(74, 222, 128, 0.16); color: #86efac; border-color: rgba(74, 222, 128, 0.25); }
    .status-processing { background: rgba(59, 130, 246, 0.16); color: #93c5fd; border-color: rgba(59, 130, 246, 0.25); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    footer { padding: 18px; text-align: center; color: #94a3b8; margin-top: 20px; }
    @media (max-width: 900px) {
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .summary-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div th:replace="fragments/header-staff :: header-staff"></div>

  <main class="container">
    <h1 class="page-title">Quản lý Đơn hàng</h1>
    <p class="page-subtitle">Theo dõi và xử lý đơn hàng hiệu quả, kèm bộ lọc theo thời gian.</p>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">Tổng đơn hàng</div>
        <div class="value" th:text = "${TongDonHang}">128</div>
      </div>
      <div class="summary-card">
        <div class="label">Tổng đơn hàng hôm nay</div>
        <div class="value" th:text = "${TongDonHomNay}">24</div>
      </div>
      <div class="summary-card">
        <div class="label">Chờ xử lý</div>
        <div class="value" th:text = "${ChoXuLy}">15</div>
      </div>
      <div class="summary-card">
        <div class="label">Hoàn tất</div>
        <div class="value" th:text = "${DaThanhToan}">89</div>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="date-filter">
          <form method="get" action="/staff/orders" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;width:100%;">
	            <label>
	            Từ ngày
	            <input type="date" id="startDate" value="${?startDate}" name = "startDate"/>
	          </label>
	          <label>
	            Đến ngày
	            <input type="date" id="endDate" value="${?endDate}" name = "endDate"/>
	          </label>
	          <button class="btn" id="applyFilter" type = "submit">Lọc</button>
          </form>
        </div>
        <div class="filter-group">
          <span class="status-badge status-pending">Đang chờ</span>
          <span class="status-badge status-complete">Hoàn tất</span>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Người mua</th>
              <th>Tổng tiền</th>
              <th>Ngày mua</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <tr data-date="2026-06-20" th:each = "item :${listorder}">
              <td th:text = "${item.order_id}">#ORD-2026-001234</td>
              <td th:text = "${item.username}">Nguyễn A</td>
              <td th:text = "${item.total_amount}">499.000đ</td>
              <td th:text = "${item.order_date}">20/06/2026</td>
              <td th:if ="${item.status == 'Pending'}"><span class="status-badge status-pending" th:text = "${item.status}">Pending</span></td>
			  <td th:if ="${item.status == 'Paid'}"><span class="status-badge status-complete" th:text = "${item.status}">Completed</span></td>
              <td>
                <div class="actions">
				<form th:action = "@{/staff/orders-detail/{id}(id =${item.order_id})}">
                  <button type = "submit" class="btn">Xem</button>
				 </form>
				 <form th:action = "@{/staff/orders-update/{id}(id =${item.order_id})}" method = "post"  th:if ="${item.status == 'Pending'}" >
                  <button class="btn secondary">Cập nhật</button>
				  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');
    const applyButton = document.getElementById('applyFilter');
    const resetButton = document.getElementById('resetFilter');
    const rows = Array.from(document.querySelectorAll('#orderTableBody tr'));

    function parseDate(value) {
      const [day, month, year] = value.split('/');
      return new Date(`${year}-${month}-${day}`);
    }

    function filterRows() {
      const start = startDate.value ? new Date(startDate.value) : null;
      const end = endDate.value ? new Date(endDate.value) : null;

      rows.forEach(row => {
        const rowDate = new Date(row.getAttribute('data-date'));
        let visible = true;

        if (start && rowDate < start) visible = false;
        if (end) {
          const endDay = new Date(end);
          endDay.setHours(23, 59, 59, 999);
          if (rowDate > endDay) visible = false;
        }

        row.style.display = visible ? '' : 'none';
      });
    }

    applyButton.addEventListener('click', filterRows);
    resetButton.addEventListener('click', () => {
      startDate.value = '2026-06-20';
      endDate.value = '2026-06-27';
      filterRows();
    });
  </script>
</body>
</html>
